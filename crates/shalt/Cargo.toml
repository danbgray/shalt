[package]
name = "shalt"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "BDD for agentic workflows: English -> Gherkin -> tests -> build"

[lib]
name = "shalt"
path = "src/lib.rs"

[[bin]]
name = "shalt"
path = "src/main.rs"

[dependencies]
shalt-core.workspace = true
clap.workspace = true
axum.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
dirs.workspace = true
tower-http.workspace = true
tokio-stream = { version = "0.1", features = ["sync"] }
ureq.workspace = true
