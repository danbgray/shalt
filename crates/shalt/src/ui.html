function mdSel(ta){
  const start = ta.selectionStart, end = ta.selectionEnd;
  return { start, end, text: ta.value.slice(start, end) };
}
function mdApply(ta, next, start, end){
  ta.value = next;
  ta.focus();
  ta.setSelectionRange(start, end);
  ta.dispatchEvent(new Event('input', { bubbles: true }));
}
function mdWrap(ta, left, right, placeholder){
  const s = mdSel(ta);
  const inner = s.text || placeholder || '';
  const before = ta.value.slice(0, s.start);
  const after = ta.value.slice(s.end);
  mdApply(ta, before + left + inner + right + after, s.start + left.length, s.start + left.length + inner.length);
}
function mdLineStarts(ta){
  const s = mdSel(ta);
  const from = ta.value.lastIndexOf('\n', Math.max(0, s.start - 1)) + 1;
  let to = ta.value.indexOf('\n', s.end);
  if (to < 0) to = ta.value.length;
  return { from, to, block: ta.value.slice(from, to) };
}
function mdPrefixLines(ta, prefix, toggle){
  const span = mdLineStarts(ta);
  const lines = span.block.split('\n');
  const all = toggle && lines.every(l => l.startsWith(prefix) || l === '');
  const next = lines.map(l => {
    if (!l) return l;
    if (all) return l.startsWith(prefix) ? l.slice(prefix.length) : l;
    if (l.startsWith(prefix)) return l;
    return prefix + l.replace(/^#{1,6}\s+/, '');
  }).join('\n');
  const before = ta.value.slice(0, span.from);
  const after = ta.value.slice(span.to);
  mdApply(ta, before + next + after, span.from, span.from + next.length);
}
function mdFence(ta){
  const s = mdSel(ta);
  const inner = s.text || 'code';
  const block = '```\n' + inner.replace(/\n?$/, '\n') + '```';
  const before = ta.value.slice(0, s.start);
  const after = ta.value.slice(s.end);
  const start = before.length + 4;
  mdApply(ta, before + block + after, start, start + inner.length);
}
function mdLink(ta){
  const s = mdSel(ta);
  const label = s.text || 'text';
  const url = window.prompt('Link URL', 'https://') || '';
  if (!url) { ta.focus(); return; }
  mdWrap(ta, '[', '](' + url + ')', label);
}
function mdTable(ta){
  const snippet = '\n| Column | Column |\n| --- | --- |\n|  |  |\n';
  const s = mdSel(ta);
  mdApply(ta, ta.value.slice(0, s.start) + snippet + ta.value.slice(s.end), s.start + snippet.length, s.start + snippet.length);
}
function mdContinueList(ta){
  const s = mdSel(ta);
  if (s.start !== s.end) return false;
  const from = ta.value.lastIndexOf('\n', Math.max(0, s.start - 1)) + 1;
  const line = ta.value.slice(from, s.start);
  const m = line.match(/^(\s*)([-*+]|\d+\.)(\s+(?:\[[ xX]\]\s+)?)(.*)$/);
  if (!m) return false;
  const indent = m[1], mark = m[2], box = m[3], rest = m[4];
  if (!rest.trim()) {
    mdApply(ta, ta.value.slice(0, from) + ta.value.slice(s.start), from, from);
    return true;
  }
  let next = mark;
  if (/^\d+\.$/.test(mark)) next = (Number(mark) + 1) + '.';
  const insert = '\n' + indent + next + (box.startsWith(' ') ? box : ' ');
  mdApply(ta, ta.value.slice(0, s.start) + insert + ta.value.slice(s.end), s.start + insert.length, s.start + insert.length);
  return true;
}
function mdIndent(ta, back){
  const span = mdLineStarts(ta);
  const lines = span.block.split('\n').map(l => {
    if (back) return l.replace(/^(\t|  )/, '');
    return l ? '  ' + l : l;
  }).join('\n');
  mdApply(ta, ta.value.slice(0, span.from) + lines + ta.value.slice(span.to), span.from, span.from + lines.length);
}
function mdStat(ta){
  const el = document.getElementById('plan-md-stat');
  if (!el || !ta) return;
  const n = (ta.value.match(/\S+/g) || []).length;
  const lines = ta.value ? ta.value.split('\n').length : 0;
  const pos = ta.selectionStart || 0;
  const row = ta.value.slice(0, pos).split('\n').length;
  el.textContent = row + ':' + (pos - (ta.value.lastIndexOf('\n', pos - 1) + 1) + 1) + '  ·  ' + lines + ' lines  ·  ' + n + ' words';
}
function planMdView(){
  const ed = document.getElementById('plan-md');
  if (!ed) return 'read';
  if (ed.classList.contains('md-write')) return 'write';
  if (ed.classList.contains('md-split')) return 'split';
  return 'read';
}
function setPlanMdView(mode, opts){
  const ed = document.getElementById('plan-md');
  if (!ed) return;
  mode = mode === 'write' || mode === 'split' || mode === 'read' ? mode : 'read';
  ed.classList.remove('md-write', 'md-split', 'md-read', 'md-preview');
  ed.classList.add('md-' + mode);
  ed.querySelectorAll('[data-md-view]').forEach(b => b.classList.toggle('on', b.dataset.mdView === mode));
  window._planEditing = mode !== 'read';
  try { localStorage.setItem('shalt-plan-md-view', mode); } catch (e) {}
  if (mode !== 'write') paintPlanLive(window._lastProject);
  const ta = document.getElementById('plan-text');
  if (mode !== 'read' && ta && !(opts && opts.keepFocus)) ta.focus();
  mdStat(ta);
}
function planEditAtEvent(ev){
  const node = ev.target.closest('h1,h2,h3,h4,p,li,blockquote,td');
  const needle = (node ? node.textContent : '').replace(/\s+/g, ' ').trim().slice(0, 48);
  setPlanMdView('write');
  const ta = document.getElementById('plan-text');
  if (!ta) return;
  if (!needle) { ta.focus(); return; }
  const raw = ta.value;
  let idx = raw.indexOf(needle);
  if (idx < 0) {
    const short = needle.replace(/^#+\s*/, '');
    idx = raw.indexOf(short);
  }
  if (idx < 0) { ta.focus(); return; }
  const end = idx + Math.min(needle.length, raw.length - idx);
  ta.focus();
  ta.setSelectionRange(idx, end);
  const line = raw.slice(0, idx).split('\n').length;
  const lh = parseFloat(getComputedStyle(ta).lineHeight) || 26;
  ta.scrollTop = Math.max(0, (line - 5) * lh);
}
function planMdToolbarHtml(){

function runPlanMd(action){
  if (action === 'save') { savePlan(); return; }
  if (action === 'cancel') {
    const p = window._lastProject;
    const ta = document.getElementById('plan-text');
    if (ta && p) ta.value = p.plan || '';
    window._planDirty = false;
    paintPlanLive(p);
    mdStat(ta);
    setPlanMdView('read', { keepFocus: true });
    return;
  }
  if (action === 'export') { exportPlan(); return; }
  const ta = document.getElementById('plan-text');
  if (!ta) return;
  if (planMdView() === 'read') setPlanMdView('write');
  if (action === 'h1') mdPrefixLines(ta, '# ', true);
  else if (action === 'h2') mdPrefixLines(ta, '## ', true);
  else if (action === 'h3') mdPrefixLines(ta, '### ', true);
  else if (action === 'bold') mdWrap(ta, '**', '**', 'bold');
  else if (action === 'italic') mdWrap(ta, '*', '*', 'italic');
  else if (action === 'strike') mdWrap(ta, '~~', '~~', 'text');
  else if (action === 'ul') mdPrefixLines(ta, '- ', true);
  else if (action === 'ol') mdPrefixLines(ta, '1. ', true);
  else if (action === 'task') mdPrefixLines(ta, '- [ ] ', true);
  else if (action === 'quote') mdPrefixLines(ta, '> ', true);
  else if (action === 'code') mdWrap(ta, '`', '`', 'code');
  else if (action === 'fence') mdFence(ta);
  else if (action === 'link') mdLink(ta);
  else if (action === 'table') mdTable(ta);
  else if (action === 'hr') {
    const s = mdSel(ta);
    mdApply(ta, ta.value.slice(0, s.start) + '\n---\n' + ta.value.slice(s.end), s.start + 5, s.start + 5);
  } else if (action === 'full') {
    const ed = document.getElementById('plan-md');
    if (ed) ed.classList.toggle('md-full');
    ta.focus();
  }
  mdStat(ta);
}
function bindMdEditor(ta){
  const bar = document.getElementById('plan-md-bar');
  if (bar && !bar.dataset.bound) {
    bar.dataset.bound = '1';
    bar.innerHTML = planMdToolbarHtml();
    bar.addEventListener('mousedown', ev => ev.preventDefault());
    bar.addEventListener('click', ev => {
      ev.preventDefault();
      ev.stopPropagation();
      const view = ev.target.closest('[data-md-view]');
      if (view) { setPlanMdView(view.dataset.mdView); return; }
      const btn = ev.target.closest('[data-md]');
      if (btn) runPlanMd(btn.dataset.md);
    });
  }
  if (!ta || ta.dataset.mdBound) return;
  ta.dataset.mdBound = '1';
  ta.addEventListener('keydown', ev => {
    const meta = ev.metaKey || ev.ctrlKey;
    if (ev.key === 'Escape') {
      const ed = document.getElementById('plan-md');
      if (ed && ed.classList.contains('md-full')) {
        ev.preventDefault();
        ed.classList.remove('md-full');
        return;
      }
      if (planMdView() !== 'read' && !window._planDirty) {
        ev.preventDefault();
        setPlanMdView('read', { keepFocus: true });
        return;
      }
    }
    if (ev.key === 'Tab') {
      ev.preventDefault();
      mdIndent(ta, ev.shiftKey);
      return;
    }
    if (ev.key === 'Enter' && !meta && !ev.shiftKey) {
      if (mdContinueList(ta)) { ev.preventDefault(); return; }
    }
    if (!meta) return;
    const k = ev.key.toLowerCase();
    if (k === 'b') { ev.preventDefault(); runPlanMd('bold'); }
    else if (k === 'i') { ev.preventDefault(); runPlanMd('italic'); }
    else if (k === 'k') { ev.preventDefault(); runPlanMd('link'); }
    else if (k === 'e' && ev.shiftKey) { ev.preventDefault(); runPlanMd('code'); }
    else if (k === '1') { ev.preventDefault(); runPlanMd('h1'); }
    else if (k === '2') { ev.preventDefault(); runPlanMd('h2'); }
    else if (k === '3') { ev.preventDefault(); runPlanMd('h3'); }
    else if (k === 's') { ev.preventDefault(); savePlan(); }
  });
  ta.addEventListener('keyup', () => mdStat(ta));
  ta.addEventListener('click', () => mdStat(ta));
  mdStat(ta);
}

  }
}

  if (!pid) return;
  const pool = [...document.querySelectorAll('input.pool-on:checked')].map(el => el.dataset.backend+'::'+(el.dataset.model||''));
  const prefer = (document.getElementById('pool-prefer')||{}).value || 'balanced';
  try {
    await api('/api/project/'+pid, { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ action:'pool_set', pool, prefer }) });
    await renderProject(pid, Object.assign(parseHash(), { rebuild: true }));
  } catch (e) { alert(e.message||e); }
}

async function changeAllocation(){
  const pid = window._specProject;
  if (!pid) return;
  await savePool();
  try {
    await api('/api/project/'+pid, { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ action:'reallocate' }) });
    await renderProject(pid, Object.assign(parseHash(), { rebuild: true }));
  } catch (e) { alert(e.message||e); }
}

async function saveAgent(kind, key, spec){
  const pid = window._specProject;
  if (!pid || !key) return;
  const [backend, ...rest] = String(spec||'').split('::');
  const model = rest.join('::');
  const now = window._focus && window._focus.now;
  const liveJob = (kind === 'job' && key)
    || (kind === 'now' && now && now.job_id)
    || (kind === 'ticket' && now && now.job_id && now.rid === key);
  const playing = !!(window._lastProject && projectIsPlaying(window._lastProject));
  if (backend && model && liveJob && playing) {
    const body = {
      action: 'switch_model',
      backend,
      model,
      job: kind === 'job' ? key : (now && now.job_id),
      rid: kind === 'ticket' ? key : (now && now.rid)
    };
    try {
      await api('/api/project/'+pid, { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify(body) });
      refreshAfterProjectAction();
    } catch (e) { alert(e.message || e); }
    return;
  }
  const body = { action: 'assign_agent', backend, model };
  if (kind === 'epic') body.epic = key;
  else body.rid = key;
  try {
    await api('/api/project/'+pid, { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify(body) });
  } catch (e) { alert(e.message||e); }
}

async function assignSprint(rid, sprint){
  const pid = window._specProject;
  if (!pid || !rid) return;
  try {
    await api('/api/project/'+pid, { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ action:'sprint_assign', rid, sprint }) });
  } catch (e) { alert(e.message||e); }
}

async function openSprint(){
  const pid = window._specProject;
  const title = await deskPrompt({ title: 'Open sprint', value: 'Sprint', ok: 'Open' });
  if (title == null) return;
  try {
    await api('/api/project/'+pid, { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ action:'sprint_open', name: title }) });
    await renderProject(pid, Object.assign(parseHash(), { rebuild: true }));
  } catch (e) { alert(e.message||e); }
}

async function closeSprint(){
  const pid = window._specProject;
  const ok = await deskConfirm({
    title: 'Close sprint',
    body: 'Close this slice, write the retro, and plan the next five tickets from what we learned?',
    ok: 'Close & plan',
    cancel: 'Keep open'
  });
  if (!ok) return;
  try {
    await api('/api/project/'+pid, { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ action:'sprint_close' }) });
    await renderProject(pid, Object.assign(parseHash(), { rebuild: true }));

function paintProjectMeta(p){
  const slot = document.getElementById('proj-transport');
  if (slot) {
    const wantPause = projectIsPlaying(p);
    const hasPause = !!document.getElementById('proj-pause');
    if (wantPause !== hasPause) {
      const name = (document.querySelector('.proj-name.title') || {}).value || p.name || p.id;
      const id = p.id || window._specProject;
      slot.innerHTML = `${p.stack_chosen === false ? stackSelect(id, p.stack) : ''}
        ${playPauseButton(id, p)}`;
      bindStackSelects(slot);
    }
  }
  const meta = document.getElementById('proj-meta');
  if (meta) {
    meta.textContent = `${p.summary.green||0} upheld · ${p.summary.red||0} failing · ${p.summary.pending||0} pending${yoloMeta(p)}${p.live?' · live':''}`;
  }
  paintWorkScope(p);
  const total = (p.summary.total||0)-(p.summary.orphan||0);
  const barEl = document.getElementById('proj-bar');
  if (barEl) barEl.innerHTML = total > 0 ? remainingBar({
    total,
    green: p.summary.green||0,
    red: p.summary.red||0,
    pending: p.summary.pending||0,
    stale: p.summary.stale||0
  }) : '';
  const gateEl = document.getElementById('proj-gate');
  if (gateEl) {
    const html = gateHtml(p);
    if (gateEl.innerHTML !== html) {
      gateEl.innerHTML = html;
      bindGate(p);
    }
  }
  paintPauseFlash(p);
  const box = document.getElementById('proj-issue');
  if (box) {
    box.innerHTML = issueHtml(p.issue, { project: p.id || window._specProject });
    bindIssueCard(box);
  }
}

function applyProjectHash(p, route){
  route = route || parseHash();
  if (route.film) {
    const want = route.rid || firstRidForJourney(p, route.film);
    if (want && want !== window._filmRid) openFilmModal(p, want);
    const onBoards = document.getElementById('panel-boards') && !document.getElementById('panel-boards').hidden;
    showProjectPanel(onBoards ? 'boards' : 'plan');
    return;
  }
  if (route.view && route.view !== 'plan' && route.view !== 'boards') closeFilmModal();
  if (route.rid && route.view === 'spec') {
    const t = ((p.draft||{}).tasks||[]).find(x => x.rid === route.rid);
    if (t) selectEntity(t.id, true);
  } else if (route.rid && route.view !== 'tests') {
    expandTicket(route.rid);
  } else if (route.view !== 'tests') {
    document.querySelectorAll('.ticket-detail').forEach(el => { el.hidden = true; });
  }
  if (route.view === 'spec' && route.file && !route.rid) {
    const f = route.file.startsWith('spec/') ? route.file : 'spec/'+route.file;
    const story = ((p.draft||{}).stories||[]).find(s => s.file === route.file || ('spec/'+s.file) === f || s.file === f);
    selectEntity(story ? story.id : 'f:'+f, true);
  } else if (route.epic) {
    selectEntity(String(route.epic).startsWith('e:') ? route.epic : 'e:'+route.epic, true);
  } else if (route.actor) {
    selectEntity(String(route.actor).startsWith('a:') ? route.actor : 'a:'+route.actor, true);
  }
  if (route.view === 'tests') paintTests(p);
  if (route.view === 'code') paintCode(p);
  showProjectPanel(route.view || 'plan');
}

function showProjectPanel(view){
  view = view || 'plan';
  if (view !== 'plan' && view !== 'boards') {
    closeJourneyModal();
    closeFilmModal();
  }
  document.querySelectorAll('.proj-panel').forEach(el => {
    el.hidden = el.dataset.view !== view;
  });
  document.querySelectorAll('.proj-tabs [data-view]').forEach(a => {
    const on = a.dataset.view === view;
    a.classList.toggle('on', on);
    a.setAttribute('aria-selected', on ? 'true' : 'false');
  });
  if (window._lastProject) {
    if (view === 'sprint') {
      paintFocus(window._lastProject);
      paintAgents(window._lastProject.agents);
      paintSprintNow(window._lastProject);
    }
    paintProjectLeads(window._lastProject);
  }
}

function entityHash(pid, id){
  if (!pid) return '#/';
  const raw = String(id || '');
  if (raw.startsWith('f:')) {
    const file = raw.slice(2).replace(/^spec\//,'');
    return `#/p/${pid}/spec/${file}`;
  }
  if (raw.startsWith('e:')) return `#/p/${pid}/epic/${raw.slice(2)}`;
  if (raw.startsWith('a:')) return `#/p/${pid}/actor/${raw.slice(2)}`;
  const t = entityById(window._draft, id);
  if (t && t.rid) {
    const file = String(t.file || '').replace(/^spec\//,'');
    if (file) return `#/p/${pid}/spec/${file}/${t.rid}`;
    return `#/p/${pid}/item/${t.rid}`;
  }
  if (t && t.file) return `#/p/${pid}/spec/${String(t.file).replace(/^spec\//,'')}`;
  if (raw.startsWith('s:') && t && t.file) return `#/p/${pid}/spec/${String(t.file).replace(/^spec\//,'')}`;
  return `#/p/${pid}`;
}

function projectDocSnap(p){
  return JSON.stringify({
    plan: p.plan || '',
    gate: p.gate || '',
    stack: p.stack || '',
    yolo: !!p.yolo,
    yolo_mode: p.yolo_mode || '',
    paused: !!p.paused,
    films: (p.films || []).map(f => f.journey+'|'+(f.stale?1:0)+'|'+(f.frames||[]).map(x => (x.file||'')+':'+(x.thumb||'')+(x.built?':1':'')).join(',')),
    journal: ((p.journal || {}).issues || []).map(i => i.date+i.number+':'+(i.dispatches||[]).map(d => (d.id||'')+':'+(d.comments||[]).length).join(',')),
    stories: ((p.draft || {}).stories || []).length,
    tasks: ((p.draft || {}).tasks || []).map(t => t.id+':'+(t.rid||'')),
    tests: (p.test_files || []).map(f => f.path+':'+f.bytes),
    src: (p.src_files || []).map(f => f.path+':'+f.bytes)
  });
}
function applyProjectNow(n){
  const p = window._lastProject;
  if (!p || !n || p.id !== n.id) return;
  p.live = n.live;
  p.paused = n.paused;
  p.yolo = n.yolo;
  if (n.yolo_mode != null) p.yolo_mode = n.yolo_mode;
  p.running = n.running;
  if (n.pause_reason != null) p.pause_reason = n.pause_reason;
  if (n.notice != null) p.notice = n.notice;
  if (n.agents) p.agents = n.agents;
  if (n.focus) p.focus = n.focus;
  if (n.focus_journey != null) p.focus_journey = n.focus_journey;
  if (n.journey_tests) p.journey_tests = n.journey_tests;
  if (n.summary) p.summary = n.summary;
  if (n.command) p.command = n.command;
  p.issue = n.issue;
  p.resume = n.resume;
  if (n.gate) p.gate = n.gate;
  if (n.harness_error !== undefined) p.harness_error = n.harness_error;
  rememberSnapshotTokens(p);
  noteLive(!!p.live || projectLive(p));
  paintProjNow(p);
  paintAskLog(p);
  paintProjectMeta(p);
  patchPlanKpis(p);
  syncAsk(p);
  if (deskVisible()) {
    paintAgents(p.agents);
    paintFocus(p);
  }
  if (n.doc && window._projDocRev && n.doc !== window._projDocRev) {
    window._wantFullDoc = true;
    window._kickAgain = true;
  } else if (n.doc && !window._projDocRev) {
    window._projDocRev = n.doc;
  }
}
function paintProjectSnapshot(p){
  const prev = window._lastProject;
  if (prev && p && prev.id === p.id) {
    if (!(p.test_files || []).length && (prev.test_files || []).length) p.test_files = prev.test_files;
    if (!(p.src_files || []).length && (prev.src_files || []).length) p.src_files = prev.src_files;
    if (p.diagrams && prev.diagrams && !p.diagrams.pipeline && prev.diagrams.pipeline) p.diagrams = prev.diagrams;
  }
  window._lastProject = p;
  window._workStarted = !!p.work_started;
  if (p.doc) window._projDocRev = p.doc;
  rememberSnapshotTokens(p);
  noteLive(!!p.live || projectLive(p));
  paintAgents(p.agents);
  paintProjNow(p);
  paintAskLog(p);
  paintSprintNow(p);
  paintProjectMeta(p);
  followFocus(p);
  syncAsk(p);
  const snap = projectDocSnap(p);
  if (window._projDocSnap === snap) {
    patchPlanKpis(p);
    paintFocus(p);
    return;
  }
  window._projDocSnap = snap;
  paintFocus(p);
  paintDraft(p.draft);
  paintPlan(p);
  paintTests(p);
  paintCode(p);
  paintProjectLeads(p);
}
async function tickProject(id){
  const title = document.querySelector('.proj-name.title');
  if (!title || title.dataset.id !== id) return;
  const wantFull = !!window._wantFullDoc;
  if (wantFull) window._wantFullDoc = false;
  if (!wantFull && window._lastProject && window._lastProject.id === id) {
    const live = await api('/api/project/'+id+'?now=1');
    if (document.querySelector('.proj-name.title')?.dataset.id !== id) return;
    applyProjectNow(live);
    return;
  }
  const view = parseHash().view || 'plan';
  const lite = view === 'plan' || view === 'spec' || view === 'sprint' || view === 'boards';
  const next = await api('/api/project/'+id+(lite ? '?lite=1' : ''));
  if (document.querySelector('.proj-name.title')?.dataset.id !== id) return;
  window._roster = next.roster || window._roster || [];
  paintProjectSnapshot(next);
}
window.addEventListener('hashchange', () => route().catch(e => {
  document.getElementById('main').innerHTML = '<p class="err">'+esc(e.message||e)+'</p>';
}));
route().catch(e => document.getElementById('main').innerHTML = '<p class="err">'+esc(e.message||e)+'</p>');
