<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>shalt</title>
<style>
  :root {
    --bg: #12141a;
    --panel: #1b1f29;
    --line: #2e3546;
    --ink: #ece7db;
    --mute: #8e97ab;
    --ok: #3dba7a;
    --bad: #e05d4e;
    --warn: #d4a017;
    --accent: #c4a35a;
    --accent-ink: #1a1408;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f3efe6;
      --panel: #fffcf6;
      --line: #ddd4c4;
      --ink: #1c1914;
      --mute: #6a6258;
      --accent: #8a6a28;
      --accent-ink: #fff8ea;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); font: 15px/1.5 "Iowan Old Style", "Palatino Linotype", Palatino, serif; }
  body { display:grid; grid-template-columns: 240px 1fr; }
  aside { border-right:1px solid var(--line); padding:22px 16px; background:var(--panel); }
  aside h1 { font-size:22px; margin:0 0 4px; font-weight:600; letter-spacing:-0.02em; }
  aside .sub { font-family: ui-monospace, Menlo, monospace; font-size:11px; color:var(--mute); letter-spacing:.06em; text-transform:uppercase; }
  nav a { display:block; padding:8px 10px; border-radius:4px; color:var(--ink); text-decoration:none; font-family: ui-sans-serif, system-ui; font-size:14px; }
  nav a:hover, nav a.on { background: #c4a35a22; }
  main { padding:36px 40px; overflow:auto; }
  h2 { font-weight:600; margin:0 0 8px; font-size:28px; letter-spacing:-0.03em; }
  .lede { color:var(--mute); margin:0 0 22px; max-width: 42rem; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:16px 18px; margin-bottom:12px; }
  .compose { border:1px solid var(--line); background:var(--panel); border-radius:12px; padding:14px 14px 12px; margin-bottom:28px; max-width: 44rem; }
  .compose textarea {
    width:100%; min-height:7.5rem; resize:vertical; border:0; background:transparent;
    color:var(--ink); font: 1.15rem/1.55 "Iowan Old Style", Palatino, serif;
    outline: none;
  }
  .compose-bar { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-top:8px; }
  select {
    font: 12px/1.3 ui-monospace, Menlo, monospace; color:var(--ink);
    background: var(--bg); border:1px solid var(--line); border-radius:6px; padding:6px 8px;
    max-width: 22rem;
  }
  button {
    background:var(--accent); color:var(--accent-ink); border:0; border-radius:6px;
    padding:8px 14px; cursor:pointer; font: 600 13px/1 ui-sans-serif, system-ui;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  .notches { display:flex; gap:3px; flex-wrap:wrap; margin:8px 0 4px; }
  .notch { width:10px; height:16px; border-radius:2px; background:var(--line); }
  .notch.green { background:var(--ok); }
  .notch.red { background:var(--bad); }
  .notch.stale { background:var(--warn); }
  .mono { font-family: ui-monospace, Menlo, monospace; font-size:12px; color:var(--mute); }
  .row { display:flex; justify-content:space-between; gap:12px; align-items:baseline; }
  table { width:100%; border-collapse:collapse; }
  td, th { text-align:left; padding:8px 6px; border-bottom:1px solid var(--line); }
  .status { font-family: ui-monospace, Menlo, monospace; font-size:12px; }
  .err { color: var(--bad); margin-top: 10px; }
  .pulse { color: var(--mute); }
  .transcript {
    font-family: ui-monospace, Menlo, monospace;
    font-size: 12px;
    line-height: 1.45;
    white-space: pre-wrap;
    max-height: 18rem;
    overflow: auto;
    margin-top: 12px;
    padding: 10px 12px;
    background: var(--bg);
    border-radius: 6px;
    color: var(--mute);
    min-height: 0;
  }
  .transcript:not(:empty) { min-height: 4rem; }
  @media (max-width: 720px) {
    body { grid-template-columns: 1fr; }
    aside { border-right:0; border-bottom:1px solid var(--line); }
    main { padding: 20px 16px; }
  }
</style>
</head>
<body>
<aside>
  <h1>shalt</h1>
  <div class="sub" id="org-name">org</div>
  <nav id="nav" style="margin-top:24px"></nav>
</aside>
<main id="main"><p class="mono">loading…</p></main>
<script>
async function api(path, opts){
  const r = await fetch(path, opts);
  if(!r.ok) throw new Error(await r.text());
  return r.json();
}
function notches(green, total){
  const n = Math.max(total, 0);
  let h = '';
  for(let i=0;i<n;i++) h += `<span class="notch ${i<green?'green':''}"></span>`;
  return `<div class="notches">${h}</div>`;
}
function esc(s){ return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function renderOrg(){
  const org = await api('/api/org');
  const models = await api('/api/models').catch(() => ({models:[]}));
  document.getElementById('org-name').textContent = org.name;
  document.getElementById('nav').innerHTML =
    `<a href="#" class="on" onclick="renderOrg();return false;">Dashboard</a>` +
    org.projects.map(p => `<a href="#" onclick="renderProject('${esc(p.id)}');return false;">${esc(p.name)}</a>`).join('');
  const jobs = await api('/api/jobs');
  const opts = (models.models||[]).map(m =>
    `<option value="${esc(m.backend)}::${esc(m.id)}">${esc(m.label)}</option>`).join('');
  const running = (jobs.jobs||[]).filter(j => j.status === 'running' || j.status === 'pending');
  document.getElementById('main').innerHTML = `
    <h2>What shall it do?</h2>
    <p class="lede">Describe the project in English. Pick Grok or a local Qwen. shalt turns that into Gherkin you can approve, then tests, then code.</p>
    <form class="compose" onsubmit="return submitCompose(event)">
      <textarea name="prompt" placeholder="The system shall… compute invoice totals exactly, in the customer’s currency, and escalate reminders as a debt ages." required></textarea>
      <div class="compose-bar">
        <select name="model">${opts || '<option value="qwen::qwen3.5:35b-128k">qwen3.5:35b-128k (local)</option>'}</select>
        <button type="submit" id="send">Specify</button>
      </div>
      <pre id="compose-log" class="transcript" aria-live="polite"></pre>
    </form>
    ${org.projects.map(p => `<div class="card">
      <div class="row"><a href="#" onclick="renderProject('${esc(p.id)}');return false;" style="font-size:18px;color:inherit;text-decoration:none">${esc(p.name)}</a>
        <span class="mono">${p.missing ? 'path missing' : esc(p.path)}</span></div>
      ${notches(p.green, p.total)}
      <div class="mono">${p.green}/${p.total} upheld</div>
    </div>`).join('')}
    <div class="card"><div class="row"><strong>Jobs</strong></div>
      <table>${(jobs.jobs||[]).map(j => `<tr>
        <td class="mono"><a href="#" onclick="renderJob('${esc(j.id)}');return false;" style="color:inherit">${esc(j.id)}</a></td>
        <td>${esc(j.kind)}</td><td>${esc(j.project_id)}</td>
        <td class="status">${esc(j.status)}</td></tr>`).join('')}</table>
    </div>`;
  if (running.length) pollJobs();
}

async function submitCompose(ev){
  ev.preventDefault();
  const form = ev.target;
  const prompt = form.prompt.value.trim();
  const [backend, ...rest] = form.model.value.split('::');
  const model = rest.join('::');
  const btn = document.getElementById('send');
  const logEl = document.getElementById('compose-log');
  btn.disabled = true;
  logEl.textContent = 'creating project…\n';
  try {
    const res = await api('/api/compose', {
      method:'POST',
      headers:{'content-type':'application/json'},
      body: JSON.stringify({ prompt, backend, model })
    });
    logEl.textContent += 'authoring ' + res.project.id + '…\n';
    await renderJob(res.job.id);
  } catch (e) {
    logEl.className = 'transcript err';
    logEl.textContent = (logEl.textContent || '') + '\n' + (e.message || String(e));
    btn.disabled = false;
  }
  return false;
}

async function jobAction(id, action, prompt, answer){
  return api('/api/jobs/'+id, {
    method:'POST',
    headers:{'content-type':'application/json'},
    body: JSON.stringify({ action, prompt, answer })
  });
}

function jobButtons(j){
  const canPause = j.status === 'running';
  const canResume = j.status === 'paused' || j.status === 'interrupted';
  return `${canPause ? `<button type="button" id="btn-pause">Pause</button>` : ''}
          ${canResume ? `<button type="button" id="btn-resume">Resume</button>` : ''}
          <button type="button" id="btn-save">Save prompt</button>`;
}

async function renderJob(id){
  const data0 = await api('/api/jobs/'+id);
  const j0 = data0.job;
  document.getElementById('main').innerHTML = `
    <p class="mono"><a href="#" onclick="renderOrg();return false;" style="color:inherit">← dashboard</a>
      · <a href="#" onclick="renderProject('${esc(j0.project_id)}');return false;" style="color:inherit">${esc(j0.project_id)}</a></p>
    <h2>Job ${esc(j0.id)}</h2>
    <p class="mono" id="job-meta">${esc(j0.kind)} · <span id="job-status">${esc(j0.status)}</span> · ${esc(j0.backend)} ${esc(j0.model)}</p>
    <div class="card">
      <div class="row"><strong>Exact prompt</strong><span id="job-actions">${jobButtons(j0)}</span></div>
      <p class="mono" style="margin:8px 0 4px">system</p>
      <pre class="transcript" style="max-height:8rem">${esc(data0.system)}</pre>
      <p class="mono" style="margin:12px 0 4px">user — edit and save; a running or paused job picks it up on the next model round</p>
      <textarea id="job-prompt" style="width:100%;min-height:8rem;font:1rem/1.45 Iowan Old Style, Palatino, serif;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:10px">${esc(j0.prompt)}</textarea>
    </div>
    <div id="job-ask" class="card" style="display:${j0.status==='waiting'?'block':'none'}">
      <strong>The model has a question</strong>
      <p id="job-ask-q" style="margin:8px 0">${esc(j0.question||'')}</p>
      <div class="compose-bar">
        <input id="job-ask-a" style="flex:1;font:1rem/1.4 Iowan Old Style, Palatino, serif;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px 10px" placeholder="Your answer"/>
        <button type="button" id="btn-answer">Answer</button>
      </div>
    </div>
    <pre id="compose-log" class="transcript" aria-live="polite">${esc(j0.log)}</pre>
    <p id="job-done"></p>
  `;
  const bind = (j) => {
    const pause = document.getElementById('btn-pause');
    const resume = document.getElementById('btn-resume');
    const save = document.getElementById('btn-save');
    if (pause) pause.onclick = () => jobAction(id,'pause');
    if (resume) resume.onclick = () => jobAction(id,'resume');
    if (save) save.onclick = () => savePrompt(id);
    const ans = document.getElementById('btn-answer');
    if (ans) ans.onclick = () => {
      const v = document.getElementById('job-ask-a').value.trim();
      if (v) jobAction(id, 'answer', undefined, v);
    };
    const done = document.getElementById('job-done');
    if (done) done.innerHTML = j.status === 'done'
      ? `<button type="button" onclick="renderProject('${esc(j.project_id)}')">Open project</button>` : '';
  };
  bind(j0);
  let j = j0;
  let active = ['running','paused','pending','waiting'].includes(j.status);
  while (active) {
    await new Promise(r => setTimeout(r, 400));
    if (!document.querySelector('h2') || !document.querySelector('h2').textContent.includes(id)) return j;
    const data = await api('/api/jobs/'+id);
    j = data.job;
    const st = document.getElementById('job-status');
    if (st) st.textContent = j.status;
    const actions = document.getElementById('job-actions');
    if (actions) { actions.innerHTML = jobButtons(j); bind(j); }
    const ask = document.getElementById('job-ask');
    const askq = document.getElementById('job-ask-q');
    const aska = document.getElementById('job-ask-a');
    if (ask) ask.style.display = j.status === 'waiting' ? 'block' : 'none';
    if (askq && j.question && document.activeElement !== aska) askq.textContent = j.question;
    const logEl = document.getElementById('compose-log');
    if (logEl) { logEl.textContent = j.log || ''; logEl.scrollTop = logEl.scrollHeight; }
    active = ['running','paused','pending','waiting'].includes(j.status);
  }
  return j;
}

async function savePrompt(id){
  const el = document.getElementById('job-prompt');
  await jobAction(id, 'save', el.value);
}

function pollJobs(){ setTimeout(() => { if (document.querySelector('h2')?.textContent?.includes('shall')) renderOrg(); }, 4000); }

async function renderProject(id){
  const p = await api('/api/project/'+id);
  document.querySelectorAll('nav a').forEach(a => a.classList.remove('on'));
  document.getElementById('main').innerHTML = `
    <h2>${esc(id)}</h2>
    <p class="mono">${p.summary.green||0} upheld · ${p.summary.red||0} failing · ${p.summary.pending||0} no test</p>
    ${notches(p.summary.green||0, (p.summary.total||0)-(p.summary.orphan||0))}
    ${(p.stories||[]).map(s => `<div class="card">
      <div style="font-size:18px">${esc(s.name)}</div>
      <div>${esc(s.narrative||'')}</div>
      <table>${s.tasks.map(t => `<tr>
        <td class="status">${esc(t.status)}</td>
        <td>${esc(t.name)}${t.holdout?' <span class="mono">holdout</span>':''}</td>
        <td class="mono">${esc(t.rid||'')}</td></tr>`).join('')}</table>
    </div>`).join('') || '<p class="mono">No scenarios yet. The author is still writing, or the spec is empty.</p>'}
    <div class="card"><strong>Board</strong>
      <table>${(p.board.items||[]).map(i => `<tr><td class="mono">${esc(i.rid)}</td><td>rank ${i.rank}</td><td>${esc(i.sprint_id||'backlog')}</td></tr>`).join('')}</table>
    </div>
    <p class="mono"><a href="#" onclick="renderOrg();return false;" style="color:inherit">← dashboard</a></p>`;
}
renderOrg().catch(e => document.getElementById('main').innerHTML = '<p class="err">'+esc(e.message||e)+'</p>');
</script>
</body>
</html>
