<script>

    b.onclick = cycleTheme;

  const k = document.getElementById('keys-btn');
  if (k) k.onclick = openKeysModal;

function cycleTheme(){
  const THEMES = ['dark','light','blue'];

  window._theme = next;
  document.documentElement.dataset.theme = next;
  localStorage.setItem('shalt-theme', next);
  const b = document.getElementById('theme-btn');
  if (b) b.textContent = next[0].toUpperCase()+next.slice(1);
  document.querySelectorAll('.diagram-lead').forEach(el => { el.dataset.src = ''; });

    try { window.mermaid.initialize(mermaidConfig()); } catch (_) {}
  }
  const here = parseHash();
  if (window._lastProject && here.page === 'project') paintProjectLeads(window._lastProject);
  else if (window._lastOrg && here.page === 'inbox') {
    const lead = document.getElementById('lead-inbox');

      lead.innerHTML = `<div class="cap">What's going on</div>

function keySlotHint(slot, envName){
  if (!slot) return 'Not set';
  if (slot.from === 'env') return 'Set in the environment ('+envName+') — that wins over this file.';
  if (slot.set) return 'Saved in ~/.shalt/config.toml';
  return 'Not set';
}
function closeKeysModal(){
  const modal = document.getElementById('keys-modal');
  if (modal) { modal.hidden = true; modal.innerHTML = ''; }
}
async function openKeysModal(){
  const modal = document.getElementById('keys-modal');
  if (!modal) return;
  let status = { xai:{}, openai:{}, anthropic:{}, path: '~/.shalt/config.toml' };
  try { status = await api('/api/keys'); } catch (_) {}
  const row = (id, label, env, slot) => {
    const fromEnv = slot && slot.from === 'env';
    const saved = !!(slot && slot.set && slot.from === 'config');
    return `<div class="keys-row">
      <label for="key-${id}">${esc(label)}</label>
      <input id="key-${id}" type="password" autocomplete="off" spellcheck="false"
        ${fromEnv ? 'disabled' : ''}
        placeholder="${fromEnv ? 'from environment' : (saved ? '•••• saved — paste to replace' : 'paste key')}">
      <p class="stat">${esc(keySlotHint(slot, env))}</p>
    </div>`;
  };
  modal.hidden = false;
  modal.innerHTML = `<div class="sheet keys-sheet" role="dialog" aria-label="API keys">
    <div class="cap">API keys</div>
    <p class="stat" style="margin:0 0 14px">Saved on this machine in ~/.shalt/config.toml. The desk never shows a key back. Local Ollama (qwen) does not need a key.</p>
    ${row('xai', 'xAI / Grok', 'XAI_API_KEY', status.xai)}
    ${row('openai', 'OpenAI', 'OPENAI_API_KEY', status.openai)}
    ${row('anthropic', 'Anthropic', 'ANTHROPIC_API_KEY', status.anthropic)}
    <p class="stat" id="keys-msg"></p>
    <div class="compose-bar">
      <button type="button" class="ghost" data-close>Close</button>
      <button type="button" id="keys-save">Save</button>
    </div>
  </div>`;
  const close = modal.querySelector('[data-close]');
  if (close) close.onclick = closeKeysModal;
  modal.onclick = ev => { if (ev.target === modal) closeKeysModal(); };
  const save = document.getElementById('keys-save');
  if (save) save.onclick = saveKeysModal;
}
async function saveKeysModal(){
  const msg = document.getElementById('keys-msg');
  const val = id => {
    const el = document.getElementById(id);
    if (!el || el.disabled) return undefined;
    const v = el.value.trim();
    return v ? v : undefined;
  };
  const body = {};
  const xai = val('key-xai');
  const openai = val('key-openai');
  const anthropic = val('key-anthropic');
  if (xai !== undefined) body.xai = xai;
  if (openai !== undefined) body.openai = openai;
  if (anthropic !== undefined) body.anthropic = anthropic;
  if (!Object.keys(body).length) {
    if (msg) msg.textContent = 'Paste a key to save. Blank fields are left as they are.';
    return;
  }
  try {
    await api('/api/keys', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify(body)
    });
    if (msg) msg.textContent = 'Saved.';
    ['key-xai','key-openai','key-anthropic'].forEach(id => {
      const el = document.getElementById(id);
      if (el && !el.disabled) { el.value = ''; el.placeholder = '•••• saved — paste to replace'; }
    });
  } catch (e) {
    if (msg) msg.textContent = e.message || String(e);
  }
}
function mermaidConfig(){
  const light = (window._theme||'dark') === 'light';
  return {
    startOnLoad: false,
    theme: light ? 'neutral' : 'dark',
    securityLevel: 'loose',
    flowchart: { htmlLabels: true, curve: 'basis', padding: 12 }
  };
}
let _mermaidP = null;
function ensureMermaid(){
  if (_mermaidP) return _mermaidP;
  _mermaidP = new Promise(resolve => {
    if (window.mermaid) {
      try { window.mermaid.initialize(mermaidConfig()); } catch (_) {}
      resolve(window.mermaid);
      return;
    }
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js';
    s.onload = () => {
      try {
        window.mermaid.initialize(mermaidConfig());
        resolve(window.mermaid);
      } catch (_) { resolve(null); }
    };
    s.onerror = () => resolve(null);
    document.head.appendChild(s);
  });
  return _mermaidP;
}
let _mmd = 0;
async function paintMermaid(el, src, title){
  if (!el) return;
  const body = String(src||'').trim();
  const cap = title || 'Now';
  if (el.dataset.src === body && el.dataset.title === cap && el.querySelector('.diagram-svg svg, pre.mermaid-src')) return;
  const gen = Number(el.dataset.gen || 0) + 1;
  el.dataset.gen = String(gen);
  el.dataset.src = body;
  el.dataset.title = cap;
  el.classList.add('diagram-lead');
  el.innerHTML = `<div class="cap">${esc(cap)}</div><div class="diagram-svg"></div>`;
  const box = el.querySelector('.diagram-svg');
  if (!body) {
    box.innerHTML = '<p class="empty">No diagram yet.</p>';
    return;
  }
  const m = await ensureMermaid();
  if (el.dataset.gen !== String(gen)) return;
  el.hidden = false;

    document.querySelectorAll('[id^="dmmd"]').forEach(n => {
      if (/Syntax error/i.test(n.innerHTML||'')) n.remove();

  }
}
function statusByRid(p){

function taskMix(tasks, stMap){

function prose(s){
  const raw = String(s||'').replace(/\r/g,'').trim();
  const lines = raw.split('\n').map(l => l.trim()).filter(l => l && !/^[-*]{3,}$/.test(l));
  const items = [];
  for (const line of lines) {
    const m = line.match(/^\d+\.\s+(.*)$/);
    if (m) items.push(m[1]);
  }
  const mark = t => esc(t).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  if (items.length >= 2) return `<ol>${items.map(i => `<li>${mark(i)}</li>`).join('')}</ol>`;
  return mark(raw).replace(/\n/g, '<br/>');
}

  return `<div class="rbar" title="upheld ${p.green||0} · failing ${p.red||0} · pending ${p.pending||0} · stale ${p.stale||0}">${seg('g', p.green)}${seg('r', p.red)}${seg('p', p.pending)}${seg('s', p.stale)}</div>`;

function spark(points){
  const pts = points || [];
  if (pts.length < 2) return '<p class="stat">Burndown starts after a second day of samples.</p>';
  const w = 180, h = 40, pad = 3;
  const ys = pts.map(x => Number(x.remaining)||0);
  const max = Math.max(...ys, 1);
  const step = (w - 2*pad) / Math.max(pts.length - 1, 1);
  const d = pts.map((pt, i) => {
    const x = pad + i * step;
    const y = h - pad - (ys[i] / max) * (h - 2*pad);
    return (i ? 'L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1);
  }).join(' ');
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-label="remaining work"><path d="${d}" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>`;
}

const RUST_KW = new Set('use fn let mut pub struct impl mod async await if else match return self Self true false const static crate super where for in while loop break continue ref move dyn trait enum type as unsafe extern box include vec macro_rules'.split(' '));
const JS_KW = new Set('const let var function return if else for while do break continue switch case default try catch finally throw new this class extends async await import export from as of in typeof instanceof void delete yield static get set super true false null undefined'.split(' '));
const FEAT_KW = /^(Feature|Rule|Background|Scenario Outline|Scenario|Examples|Given|When|Then|And|But)\b:?/;

function rustStringAt(s, i){
  if (s[i] !== 'r' && s[i] !== '"') return null;
  if (s[i] === 'r') {
    let n = i+1, hashes = 0;
    while (s[n] === '#') { hashes++; n++; }
    if (s[n] !== '"') return null;
    const close = '"' + '#'.repeat(hashes);
    const start = n+1;
    const end = s.indexOf(close, start);
    return { end: end < 0 ? s.length : end + close.length };
  }
  let j = i+1;
  while (j < s.length) {
    if (s[j] === '\\') { j += 2; continue; }
    if (s[j] === '"') return { end: j+1 };
    j++;
  }
  return { end: s.length };
}

function extractRustString(s){
  s = String(s||'').trim();
  const hit = rustStringAt(s, 0);
  if (!hit || (s[0] !== 'r' && s[0] !== '"')) {
    return s.replace(/^["']|["']$/g, '');
  }
  if (s[0] === 'r') {
    let n = 1, hashes = 0;
    while (s[n] === '#') { hashes++; n++; }
    return s.slice(n+1, hit.end - hashes - 1);
  }
  return s.slice(1, hit.end-1);
}

function hlPush(out, cls, s){
  if (!s) return;
  out.push(cls ? `<span class="${cls}">${esc(s)}</span>` : esc(s));
}
function quotedEnd(s, i, q){
  let j = i + 1;
  while (j < s.length) {
    if (s[j] === '\\') { j += 2; continue; }
    if (s[j] === q) return j + 1;
    j++;
  }
  return s.length;
}
function highlightLine(line){
  return highlightLangLine(line, 'rs');
}
function highlightLangLine(line, lang){
  if (lang === 'feature') return highlightFeatureLine(line);
  if (lang === 'js') return highlightJsLine(line);
  if (lang === 'css') return highlightCssLine(line);
  if (lang === 'html') return highlightHtmlLine(line);
  if (lang === 'json') return highlightJsLine(line);
  if (lang === 'toml') return highlightTomlLine(line);
  if (lang === 'md') return highlightMdLine(line);
  if (lang === 'rs') return highlightRustLine(line);
  return esc(line);
}
function highlightRustLine(line){
  const out = [];
  let i = 0;
  while (i < line.length) {
    if (line.startsWith('//', i)) { hlPush(out, 'tok-cmt', line.slice(i)); break; }
    if (line.startsWith('/*', i)) {
      const end = line.indexOf('*/', i+2);
      if (end < 0) { hlPush(out, 'tok-cmt', line.slice(i)); break; }
      hlPush(out, 'tok-cmt', line.slice(i, end+2)); i = end+2; continue;
    }
    const raw = rustStringAt(line, i);
    if (raw && (line[i] === 'r' || line[i] === '"')) {
      hlPush(out, 'tok-str', line.slice(i, raw.end)); i = raw.end; continue;
    }
    if (line[i] === "'" && line[i+1]) {
      let j = i+1;
      if (line[j] === '\\') j += 2; else j += 1;
      if (line[j] === "'") j++;
      hlPush(out, 'tok-str', line.slice(i, j)); i = j; continue;
    }
    if (line.startsWith('#[', i)) {
      const end = line.lastIndexOf(']');
      if (end > i) { hlPush(out, 'tok-attr', line.slice(i, end+1)); i = end+1; continue; }
    }
    const id = line.slice(i).match(/^[A-Za-z_][A-Za-z0-9_]*/);
    if (id) {
      const w = id[0];
      const cls = RUST_KW.has(w) ? 'tok-kw' : /^[A-Z]/.test(w) ? 'tok-ty' : '';
      hlPush(out, cls, w); i += w.length; continue;
    }
    const num = line.slice(i).match(/^\d[\d_]*(?:\.\d[\d_]*)?/);
    if (num) { hlPush(out, 'tok-num', num[0]); i += num[0].length; continue; }
    hlPush(out, '', line[i]); i++;
  }
  return out.join('');
}
function highlightJsLine(line){
  const out = [];

function cucumberRe(def){

  try {
    if (def.regex) return new RegExp('^(?:' + def.pattern + ')$');
    let s = def.pattern.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    s = s.replace(/\\\{string\\\}/g, '"[^"]*"')
      .replace(/\\\{int\\\}/g, '-?\\d+')
      .replace(/\\\{float\\\}/g, '-?\\d+(?:\\.\\d+)?')
      .replace(/\\\{word\\\}/g, '[^\\s]+');
    return new RegExp('^' + s + '$');
  } catch (_) { return null; }
}

function stepVerb(keyword, prev){

  if (/^(Given|When|Then)$/i.test(kw)) return kw[0].toUpperCase() + kw.slice(1).toLowerCase();
  return prev || 'Given';

function stepBindIndex(p){

  const tasks = ((p && p.draft) || {}).tasks || [];
  const key = tests.map(f => f.path+':'+(f.body||'').length).join('|')+'#'+tasks.length;
  if (window._bindSnap === key && window._binds) return window._binds;
  const defs = [];
  tests.forEach(f => parseStepDefs(f.path, f.body||'').forEach(d => defs.push(d)));
  const whenCalls = defs.filter(d => d.kw === 'when').flatMap(d => [...String(d.body||'').matchAll(/\b([A-Za-z_][A-Za-z0-9_]*)\s*\(/g)].map(m => m[1]));

  const byLine = {};
  const lookup = [];
  compiled.forEach(d => lookup.push(d));
  tasks.forEach(t => {
    let verb = 'Given';
    (t.steps || []).forEach(s => {
      verb = stepVerb(s.keyword, verb);
      const text = String(s.text||'').trim();
      const hit = compiled.find(d => d.kw === verb.toLowerCase() && d.re && d.re.test(text));
      if (!hit) return;
      const rec = {
        id: t.id, rid: t.rid, name: t.name, file: t.file,
        keyword: s.keyword || verb, text, path: hit.path, line: hit.line

      (byLine[hit.path+':'+hit.line] || (byLine[hit.path+':'+hit.line] = [])).push(rec);

function findStepBinding(p, keyword, text, prevVerb){
  const verb = stepVerb(keyword, prevVerb);
  const t = String(text||'').trim();
  if (!t) return null;
  const idx = stepBindIndex(p);
  return (idx.lookup || []).find(d => d.kw === verb.toLowerCase() && d.re && d.re.test(t)) || null;
}

function firstBindingForTask(p, task){
  if (!task) return null;
  let verb = 'Given';
  for (const s of task.steps || []) {
    verb = stepVerb(s.keyword, verb);
    const hit = findStepBinding(p, verb, s.text, verb);
    if (hit) return hit;
  }
  return null;
}

function zoneTreeModel(files){

  (files || []).forEach(f => {
    const parts = String(f.path || '').split('/').filter(Boolean);
    if (!parts.length) return;
    let node = root;
    for (let i = 0; i < parts.length - 1; i++) {
      const name = parts[i];
      const path = parts.slice(0, i + 1).join('/');
      node.dirs[name] = node.dirs[name] || { name, path, dirs: {}, files: [] };

function projectSummary(p){

  const state = p.state || (p.paused ? 'paused' : p.running ? 'playing' : p.waiting ? 'waiting' : p.blocked ? 'failed' : 'idle');
  if (state === 'playing') bits.push(phase);
  else if (state === 'paused') bits.push(p.phase ? 'Paused · '+phase : 'Paused');
  else if (state === 'waiting') bits.push(yoloModeOf(p) === 'all' ? 'Yolo · taking the guess' : (p.detail || 'Waiting on you'));
  else if (state === 'failed') bits.push(p.detail ? 'Failed · '+p.detail : 'Failed');
  else if (state === 'interrupted') bits.push(p.detail || 'Stopped — Play to resume');
  else bits.push('Idle');
  const ym = yoloModeOf(p);
  if (ym === 'all' && state !== 'waiting') bits.push('Yolo all');
  else if (ym === 'plan') bits.push('Yolo plan');
  if (p.remaining) bits.push(p.remaining + ' remaining');

async function submitCompose(ev){

  const logEl = document.getElementById('compose-log');

    const res = await api('/api/compose', {
      method:'POST',
      headers:{'content-type':'application/json'},

        path: path || undefined,

async function sendAskChat(decide){
  decide = decide === true;
  const id = window._askId;
  const inp = document.getElementById('ask-chat-in');
  const text = decide ? '' : ((inp && inp.value) || '').trim();
  if (!id || window._askSending) return;
  if (!decide && !text) return;
  if (inp && !decide) inp.value = '';
  window._askSending = true;
  const send = document.getElementById('ask-send');
  const decideBtn = document.getElementById('ask-decide');
  if (send) { send.disabled = true; send.textContent = '…'; }
  if (decideBtn) decideBtn.disabled = true;
  const turn = Object.assign({ question: '', guess: '', chat: [] }, window._openTurn || {});
  const line = decide ? 'Decide.' : text;
  turn.chat = (turn.chat || []).concat([{ role: 'user', content: line }]);
  window._openTurn = turn;
  paintAskThread(turn);
  const thread = document.getElementById('ask-thread');
  if (thread) {
    thread.insertAdjacentHTML('beforeend', `<div class="qa" id="ask-thinking"><div class="who">Shalt</div><div class="body">Thinking…</div></div>`);
    thread.scrollTop = thread.scrollHeight;
  }
  try {
    const extra = askAgentOpts();
    const raw = await jobAction(id, decide ? 'decide' : 'chat', undefined, undefined, decide ? undefined : text, extra);
    let next = openTurnFrom(raw);
    if (!next || !(next.chat||[]).some(m => m.role === 'assistant')) {
      const again = await api('/api/jobs/'+id).catch(() => null);
      next = openTurnFrom(again) || next;
    }
    if (next) {
      window._openTurn = next;
      const think = document.getElementById('ask-thinking');
      if (think) think.remove();
      paintAskThread(next);
      if (!(next.chat||[]).some(m => m.role === 'assistant')) {
        throw new Error('No reply from the model. Try Send again.');
      }
    } else {
      throw new Error('No reply from the model. Try Send again.');
    }
  } catch (e) {
    const think = document.getElementById('ask-thinking');
    if (think) think.remove();
    const thread = document.getElementById('ask-thread');
    if (thread) thread.insertAdjacentHTML('beforeend', `<div class="qa"><div class="who">Error</div><div class="body">${esc(e.message||e)}</div></div>`);
  } finally {
    window._askSending = false;
    if (send) { send.disabled = false; send.textContent = 'Send'; }
    if (decideBtn) decideBtn.disabled = false;
    if (inp) inp.focus();
  }
}
async function openAsk(jobId){
  if (!jobId) return;
  const modal = document.getElementById('ask-modal');
  if (!modal) return;
  const live = !modal.hidden && modal.dataset.job === jobId && document.getElementById('ask-thread');
  if (live || window._askSending) return;
  window._askId = jobId;
  window._askDismissed = null;
  hideAskBar();
  let data;
  try { data = await api('/api/jobs/'+jobId); }
  catch (e) { closeAsk(); return; }
  if (window._askId !== jobId) return;
  const j = data.job;
  if (!j || j.status !== 'waiting') { closeAsk(); hideAskBar(); return; }
  const turns = j.turns || [];
  const open = turns.find(t => !(t.answer||'').trim()) || { question: j.question||'', guess: '', chat: [] };
  window._openTurn = open;
  const last = lastAssistant(open);
  const extracted = /ANSWER:/i.test(last) ? parseAnswer(last) : '';
  const seed = extracted || (open.guess || '');
  modal.dataset.job = jobId;
  modal.hidden = false;
  modal.innerHTML = `<div class="sheet ask-sheet" role="dialog" aria-modal="true" aria-labelledby="ask-title">
    <div class="ask-head">
      <div class="cap" id="ask-title">Waiting on you · ${esc(kindLabel(j.kind))} · ${esc(j.id)}</div>
      <button type="button" class="ghost ask-dismiss" id="ask-dismiss" title="Dismiss" aria-label="Dismiss">×</button>
    </div>
    <div class="q">${prose(open.question || 'A question is waiting.')}</div>
    <p class="stat">Play is ${esc([j.backend, j.model].filter(Boolean).join(' ') || 'unassigned')} · a different agent can write the answer</p>
    <div class="ask-agent" id="ask-agent">${pairSelects('answer', j.id, j.answer_backend || '', j.answer_model || '', 'Same as Play')}</div>
    <div class="ask-thread" id="ask-thread"></div>
    <div class="ask-chat-row">
      <textarea id="ask-chat-in" placeholder="Talk it through… what should it do?"></textarea>
      <button type="button" class="ghost" id="ask-decide">Decide</button>
      <button type="button" id="ask-send">Send</button>
    </div>
    <div class="ask-a-label">Agreed answer</div>
    <textarea id="ask-a" placeholder="The model fills this when you agree — or type it yourself.">${esc(seed)}</textarea>
    <p class="hint">Pick who drafts the answer. Decide lets that agent fill it. Continue unblocks Play.</p>
    <div class="compose-bar">
      <button type="button" class="ghost" id="ask-later">Dismiss</button>
      <button type="button" id="ask-go">Continue</button>
    </div>
  </div>`;
  modal.onclick = ev => { if (ev.target === modal) laterAsk(); };
  document.getElementById('ask-later').onclick = laterAsk;
  const dismiss = document.getElementById('ask-dismiss');
  if (dismiss) dismiss.onclick = laterAsk;
  document.getElementById('ask-go').onclick = submitAsk;
  document.getElementById('ask-send').onclick = () => sendAskChat(false);
  const decideBtn = document.getElementById('ask-decide');
  if (decideBtn) decideBtn.onclick = () => sendAskChat(true);
  bindAskAgent(j.id);
  paintAskThread(open);
  const ta = document.getElementById('ask-a');
  if (seed) {
    ta.dataset.fromModel = extracted ? '1' : '0';
    if (extracted) ta.dataset.lastExtracted = extracted;
    ta.classList.add('ready');
  }
  growlAsk(jobId, (open.question || '').split('\n')[0]);
  const chat = document.getElementById('ask-chat-in');
  chat.focus();
  chat.onkeydown = ev => {
    if (ev.key === 'Enter' && !ev.shiftKey) { ev.preventDefault(); sendAskChat(); }
    if (ev.key === 'Escape') { ev.preventDefault(); laterAsk(); }
  };
  ta.onkeydown = ev => {
    if (ev.key === 'Enter' && (ev.metaKey || ev.ctrlKey)) { ev.preventDefault(); submitAsk(); }
    if (ev.key === 'Escape') { ev.preventDefault(); laterAsk(); }
  };
  ta.oninput = () => { ta.dataset.fromModel = '0'; ta.classList.remove('ready'); };
}
async function submitAsk(){
  const id = window._askId;
  const ta = document.getElementById('ask-a');
  let v = ((ta && ta.value) || '').trim();
  if (!v) v = ((window._openTurn && window._openTurn.guess) || '').trim();
  if (!id || !v) {
    if (ta) { ta.focus(); ta.classList.add('ready'); }
    return;
  }
  const btn = document.getElementById('ask-go');
  if (btn) btn.disabled = true;
  try {
    await jobAction(id, 'answer', undefined, v);
    closeAsk();
    window._askDismissed = null;
    hideAskBar();
    noteLive(true);
    armClock(200);
  } catch (e) {
    if (btn) btn.disabled = false;
    alert(e.message || e);
  }
}
function syncAsk(p){

}

function deskPrompt(opts){

function paintSteps(steps, rid){
  const p = window._lastProject;
  const pid = (p && p.id) || window._specProject || '';
  const st = rid ? (statusByRid(p)[rid] || 'pending') : '';
  const fail = rid ? (failureByRid(p)[rid] || '') : '';
  const list = steps || [];
  let verb = 'Given';
  const lastThen = [...list].map((s,i) => ({s,i})).reverse().find(x => /^(Then)$/i.test(x.s.keyword||''));
  const html = list.map((s, i) => {
    verb = stepVerb(s.keyword, verb);
    const bind = p ? findStepBinding(p, verb, s.text, verb) : null;
    const test = (bind && pid)
      ? `<a class="step-test" href="${esc(testHref(pid, bind.path, bind.line))}" title="${esc(bind.path+':'+bind.line)}">test</a>`
      : '';
    let mark = '';
    if (st === 'green') mark = statusMark('green');
    else if (st === 'red' && lastThen && lastThen.i === i) mark = statusMark('red');
    else if (st === 'red') mark = statusMark('green');
    else if (st) mark = statusMark(st);
    let t = `<div class="step">${mark}<span class="kw">${esc(s.keyword)}</span><span>${esc(s.text)}</span>${test}</div>`;
    if (s.docstring) t += `<pre class="transcript" style="max-height:6rem;margin-left:5.2rem">${esc(s.docstring)}</pre>`;
    if (s.table && s.table.length) {
      t += `<table class="tbl">${s.table.map(row => `<tr>${row.map(c => `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</table>`;
    }
    return t;
  }).join('');
  if (fail && !isHarnessFailure(fail)) {
    return html + `<pre class="fail-box">${esc(fail)}</pre>`;
  }
  return html;
}

        return (e.id === s.id ? '' : btn(s.id, s.name, s.actor)) + ts.map(t => {
          const st = stMap[t.rid] || 'pending';
          return `<button type="button" data-ent="${esc(t.id)}" class="${selectedEntity===t.id?'on':''}">${statusMark(st)} ${esc(t.name)}<span class="mono">${esc(t.rid||'unstamped')}</span></button>`;
        }).join('');
      }).join('')}</div></details>`;
  }).join('');
  if (!has) {
    list.innerHTML = fileBits || `<h3>Epics</h3><p class="empty" style="padding:0 8px">Features will appear here as they are written.</p>`;
    if (!document.getElementById('gh-features')) paintDetail(d, null);
  } else {
  const showLoose = loose.length && (d.epics||[]).filter(e => e.name && e.name !== 'unassigned').length;
  list.innerHTML =
    `<h3>Journeys</h3>${epicHtml || '<p class="empty" style="padding:0 8px">Waiting for the first feature…</p>'}
     ${showLoose ? `<h3>Ungrouped</h3>${loose.map(s => btn(s.id, s.name, s.actor)).join('')}` : ''}
     <h3>Actors</h3>${(d.actors||[]).map(a => btn(a.id, a.name, a.story_ids.length+' stories')).join('') || '<p class="empty" style="padding:0 8px">—</p>'}
     ${fileBits}`;
  if (!document.getElementById('gh-features')) paintDetail(d, selectedEntity);
  }
  }
  if (!has) {
    if (dia) dia.innerHTML = '';
    return;
  }
  if (dia) {
    const uc = (d.actors||[]).map(a => {
      const stories = (d.stories||[]).filter(s => a.story_ids.includes(s.id));
      return `<div class="uc-actor" data-ent="${esc(a.id)}">
        <div class="uc-who">${esc(a.name)}</div>
        ${stories.map(s => `<button type="button" class="uc-want" data-ent="${esc(s.id)}">${esc(s.capability||s.name)}</button>`).join('')}
      </div>`;
    }).join('');
    const boardTicket = (rid) => {
      const rows = (window._lastProject && window._lastProject.queue) || [];
      return (rid && rows.find(r => r.rid === rid)) || {};
    };
    const taskEst = (t) => Number(boardTicket(t.rid).estimate) || 0;
    const storyCard = (s) => {
      const tasks = (d.tasks||[]).filter(t => t.story_id===s.id);
      const est = tasks.reduce((n, t) => n + taskEst(t), 0);
      const green = tasks.filter(t => boardTicket(t.rid).status === 'green').length;
      const cmdEpic = ((window._lastProject && window._lastProject.command && window._lastProject.command.epics) || []).find(e => e.name === s.epic);
      const budget = (cmdEpic && cmdEpic.estimated) || est;
      const headMeta = [
        tasks.length + ' scenario' + (tasks.length===1?'':'s'),
        est ? tok(est) : (budget ? tok(budget) : ''),
        green ? green + ' upheld' : '',
        s.actor || ''
      ].filter(Boolean).join(' · ');
      const rows = tasks.map(t => {
        const row = boardTicket(t.rid);
        const st = row.status || (t.rid ? 'pending' : 'unstamped');
        const bits = [
          st,
          t.rid || 'unstamped',
          taskEst(t) ? tok(taskEst(t)) : '',
          t.holdout ? 'holdout' : ''
        ].filter(Boolean);
        const href = window._specProject ? entityHash(window._specProject, t.id) : '#';
        const nowRid = (window._focus && window._focus.now && window._focus.now.rid) || '';
        return `<a class="break-task${t.rid===nowRid?' now':''}" data-ent="${esc(t.id)}" href="${href}">
          <span>${esc(t.name)}</span>
          <span class="meta">${statusDot(st)} ${esc(bits.join(' · '))}</span>
        </a>`;
      }).join('');
      return `<div class="break-card">
        <button type="button" class="break-head" data-ent="${esc(s.id)}">
          <div>${esc(s.name)}</div>
          <div class="stat">${esc(headMeta)}</div>
        </button>
        ${rows || '<p class="empty">No scenarios yet.</p>'}
      </div>`;
    };
    const storyOrder = epics.flatMap(e => (d.stories||[]).filter(s => (e.story_ids||[]).includes(s.id))).concat(loose);
    const seen = new Set();
    const uniqueStories = storyOrder.filter(s => { if (seen.has(s.id)) return false; seen.add(s.id); return true; });
    const nEst = uniqueStories.reduce((n, s) => n + (d.tasks||[]).filter(t => t.story_id===s.id).reduce((m, t) => m + taskEst(t), 0), 0);
    const nTasks = (d.tasks||[]).length;
    dia.innerHTML = `
      <div class="card"><strong>Use cases</strong>
        <div class="usecase">${uc || '<p class="empty">No actors yet.</p>'}</div></div>
      <div class="card"><strong>Breakdown</strong>
        <p class="stat">${uniqueStories.length} feature${uniqueStories.length===1?'':'s'} · ${nTasks} scenario${nTasks===1?'':'s'}${nEst ? ' · '+tok(nEst)+' estimated' : ''}</p>
        <div class="break-grid">${uniqueStories.map(storyCard).join('') || '<p class="empty">No features yet.</p>'}</div></div>`;
  }
}

function selectEntity(id, silent){
  const d = window._draft;
  if (d && id) {
    const e = entityById(d, id);
    if (e && e.task_ids && !e.steps) {
      const tasks = (d.tasks || []).filter(t => t.story_id === e.id);
      const keep = tasks.find(t => t.id === selectedEntity);
      if (tasks.length) id = (keep || tasks[0]).id;
    }
  }
  selectedEntity = id;
  closeJourneyModal();
  closeFilmModal();
  hideChartPop();
  paintGherkinNav(d);
  paintDetail(d, id);
  markSelected();
  if (!silent && window._specProject) {
    setHash(entityHash(window._specProject, id));
    showProjectPanel('spec');
  }
}

async function specTask(action, task, extra){
  const pid = window._specProject;
  if (!pid) { alert('No project bound to this view.'); return null; }
  const file = task.file || '';
  const line = task.block_start || task.line;
  return api('/api/project/'+pid, {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify(Object.assign({ action, file, line, rid: task.rid || undefined }, extra||{}))
  });
}

async function refreshDraft(){
  window._draftSnap = '';
  const jobH = document.querySelector('h2');
  if (jobH && jobH.textContent.includes('Job ')) {
    const id = jobH.textContent.replace('Job ','').trim();
    const data = await api('/api/jobs/'+id);
    paintDraft(data.draft);
    return;
  }
  const title = document.querySelector('.proj-name.title');
  if (title && title.dataset.id) {
    const p = await api('/api/project/'+title.dataset.id);
    paintDraft(p.draft);
  }
}

async function deleteTask(task){
  const ok = await deskConfirm({
    title: 'Delete from spec',
    body: 'Delete “'+(task.name||'this task')+'” from the spec?',
    ok: 'Delete',
    cancel: 'Keep',
    danger: true
  });
  if (!ok) return;
  try {
    await specTask('delete_task', task);
    selectedEntity = task.story_id || null;
    await refreshDraft();
  } catch (e) { deskAlert(e.message||e); }
}

async function promoteTask(task){
  try {
    const res = await specTask('promote_task', task);
    await refreshDraft();
    if (res && res.rid) {
      const el = document.getElementById('draft-detail');
      if (el) {
        const note = document.createElement('p');
        note.className = 'mono';
        note.textContent = 'Promoted '+res.rid+' to the front of the board.';
        el.prepend(note);
      }
    }
  } catch (e) { alert(e.message||e); }
}

function fileBody(d, file){
  const want = String(file||'');
  return ((d && d.files) || []).find(f => f.path === want || f.path === 'spec/'+want || f.path.endsWith('/'+want))?.body || '';
}

function tasksForFile(d, file){
  const rel = String(file||'').replace(/^spec\//,'');
  return ((d && d.tasks) || []).filter(t => {
    const tf = String(t.file||'').replace(/^spec\//,'');
    return tf === rel;
  });
}

function gherkinViewHtml(d, file, body, focusId){
  const reading = arguments.length >= 4;
  const tasks = tasksForFile(d, file);
  const pid = window._specProject || '';
  const proj = window._lastProject;
  const stMap = statusByRid(proj);
  const failMap = failureByRid(proj);
  const lines = String(body||'').replace(/\r\n/g, '\n').split('\n');
  let current = null;
  let lastVerb = 'Given';
  let openId = null;
  let html = '';
  const closeBlock = () => {
    if (!openId) return;
    if (reading && focusId && openId === focusId) {
      const task = tasks.find(t => t.id === openId);
      const st = task && task.rid ? (stMap[task.rid] || '') : '';
      const fail = task && task.rid ? (failMap[task.rid] || '') : '';
      if (st === 'red' && fail && !isHarnessFailure(fail)) {
        html += `<pre class="gh-inline-fail">${esc(fail)}</pre>`;
      }
    }
    html += '</div>';
    openId = null;
  };
  const openBlock = (task) => {
    const id = task && task.id;
    if (openId === id) return;
    closeBlock();
    if (!id) return;
    const on = reading && focusId && id === focusId;
    html += `<div class="gh-block${on?' on':''}">`;
    openId = id;
  };
  lines.forEach((line, i) => {
    const n = i + 1;
    const scen = line.match(/^(\s*)(Scenario(?: Outline)?)\s*:\s*(.*)$/i);
    const feat = line.match(/^(\s*)(Feature)\s*:\s*(.*)$/i);
    const bg = line.match(/^(\s*)(Background)\s*:/i);
    const step = line.match(/^(\s*)(Given|When|Then|And|But)\b(.*)$/i);
    const tag = line.match(/^(\s*)(@\S.*)$/);
    if (feat || bg || scen) lastVerb = 'Given';
    if (feat || bg) { closeBlock(); current = null; }
    const rid = (line.match(/@rid:(S-[0-9a-f]+)/i) || [])[1];
    if (rid) {
      const hit = tasks.find(t => t.rid === rid);
      if (hit) current = hit;
    }
    if (scen) {
      const name = (scen[3] || '').trim();
      current = tasks.find(t => t.line === n || t.block_start === n)
        || tasks.find(t => t.name === name)
        || tasks.find(t => Math.abs((t.line||0) - n) <= 3 && t.name === name)
        || current;
      openBlock(current);
    } else if (current && !feat && !bg) {
      openBlock(current);
    }
    let inner;
    const cls = ['gh-line'];
    let bind = null;
    const st = current && current.rid ? (stMap[current.rid] || '') : '';
    const focused = reading && current && current.id === focusId;
    if (scen) {
      cls.push('gh-scen');
      if (st === 'green') cls.push('gh-green');
      else if (st === 'red') cls.push('gh-red');
      else if (st === 'stale') cls.push('gh-stale');
      const specHref = current && pid ? entityHash(pid, current.id) : '';
      const test = proj && current ? firstBindingForTask(proj, current) : null;
      const title = specHref
        ? `<a class="gh-title" data-ent="${esc(current.id)}" href="${esc(specHref)}">${esc(scen[3])}</a>`
        : `<span class="gh-title">${esc(scen[3])}</span>`;
      inner = `${esc(scen[1])}${st?statusMark(st):''}<span class="gh-kw">${esc(scen[2])}:</span> ${title}`;
      if (test && pid) inner += `<a class="gh-test" href="${esc(testHref(pid, test.path, test.line))}" title="${esc(test.path+':'+test.line)}">test</a>`;
      html += `<div class="${cls.join(' ')}">${inner}</div>`;
      return;
    } else if (feat) {
      cls.push('gh-feat');
      inner = `${esc(feat[1])}<span class="gh-kw">${esc(feat[2])}:</span> ${esc(feat[3])}`;
    } else if (step) {
      cls.push('gh-step');
      lastVerb = stepVerb(step[2], lastVerb);
      bind = proj ? findStepBinding(proj, lastVerb, String(step[3]||'').trim(), lastVerb) : null;
      let mark = '';
      if (focused && st === 'green') mark = statusMark('green');
      else if (focused && st === 'red' && /^Then$/i.test(step[2])) mark = statusMark('red');
      else if (focused && st === 'red') mark = statusMark('green');
      inner = `${mark}${esc(step[1])}<span class="gh-kw">${esc(step[2])}</span>${esc(step[3])}`;
    } else if (tag) {
      cls.push('gh-tag');
      inner = `${esc(tag[1])}<span class="gh-at">${esc(tag[2])}</span>`;
    } else if (line.trim() && !feat) {
      cls.push('gh-desc');
      inner = esc(line) || '&nbsp;';
    } else {
      inner = esc(line) || '&nbsp;';
    }
    if (step && bind && pid) {
      html += `<a class="${cls.join(' ')}" href="${esc(testHref(pid, bind.path, bind.line))}" title="${esc('Open test · '+bind.path+':'+bind.line)}">${inner}</a>`;
      const verb = lastVerb;
      if (/^Then$/i.test(verb) && bind.body) {
        const flag = bind.acts
          ? `<span class="gh-oracle-flag">${esc(bind.acts)}</span>`
          : '';
        html += `<pre class="gh-oracle${bind.acts?' acts':''}" title="Then body — this is the door">${flag}${esc(bind.body.trim())}</pre>`;
      }
      return;
    }
    if (current && (step || (tag && rid))) {
      const href = pid ? entityHash(pid, current.id) : '#';
      const tip = (current.name || '') + (current.rid ? ' · ' + current.rid : '');
      html += `<a class="${cls.join(' ')}" data-ent="${esc(current.id)}" href="${href}" title="${esc(tip)}">${inner}</a>`;
      return;
    }
    html += `<div class="${cls.join(' ')}">${inner}</div>`;
  });
  closeBlock();
  const n = tasks.length;
  const hint = reading ? '' : (n
    ? `<p class="stat">Click a scenario · ${n} scenario${n===1?'':'s'}</p>`
    : '<p class="stat">Scenarios become clickable once they parse.</p>');
  return `${hint}<div class="gherkin${reading?' gh-read':''}" role="document">${html}</div>`;
}

function fileEditorHtml(d, file){
  const path = file && (String(file).startsWith('spec/') ? file : 'spec/'+file);
  const body = fileBody(d, file);
  return `<div class="cap" style="margin-top:16px">${esc(path||'feature file')}</div>
    ${gherkinViewHtml(d, file, body)}
    <details class="fold">

        <button type="button" class="ghost" id="spec-file-save">Save file</button>
      </div>
      <p class="stat" id="spec-file-msg">${window._workStarted ? 'The spec is living. Saving can stale greens; Play re-runs tests and continues. Pause only if a job is writing files right now.' : ''}</p>

}

function paintFileEditor(el, d, path){

  bindFileEditor();
}

async function saveSpecFile(){
  const pid = window._specProject;
  const ta = document.getElementById('spec-file');
  const msg = document.getElementById('spec-file-msg');
  if (!pid || !ta) return;
  const file = ta.dataset.file || '';
  try {
    const res = await api('/api/project/'+pid, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ action: 'save_file', file, content: ta.value })
    });
    if (msg) msg.textContent = res.warn || 'Saved.';
    window._draftSnap = '';
    await refreshDraft();
  } catch (e) {
    if (msg) msg.textContent = e.message || e;
  }
}

function paintSpecTalk(talk, workStarted){
  const thread = document.getElementById('spec-talk-thread');
  const hint = document.getElementById('spec-talk-hint');
  if (hint) {
    hint.textContent = workStarted
      ? 'The spec is living. Tests and code can show it needs to change. Talk here, then Play continues (re-run, rewrite tests, or build). Pause only if a job is running.'
      : 'Talk through the spec here, then Play writes tests. The spec can still change after that.';
  }
  if (!thread) return;
  const msgs = (talk && talk.messages) || [];
  thread.innerHTML = msgs.map(m =>
    `<div class="qa ${m.role==='assistant'?'reply':''}"><div class="who">${esc(m.role)}</div><div class="body">${prose(m.content)}</div></div>`
  ).join('') || '<p class="empty">Ask to add a scenario, change an example, or drop a behaviour.</p>';
  thread.scrollTop = thread.scrollHeight;
}

async function sendSpecTalk(){
  const pid = window._specProject;
  const inp = document.getElementById('spec-talk-in');
  const btn = document.getElementById('spec-talk-send');
  if (!pid || !inp) return;
  const text = inp.value.trim();
  if (!text) return;
  inp.value = '';
  const thread = document.getElementById('spec-talk-thread');
  if (thread) thread.insertAdjacentHTML('beforeend', `<div class="qa"><div class="who">user</div><div class="body">${prose(text)}</div></div>`);
  if (btn) btn.disabled = true;
  try {
    const talk = await api('/api/project/'+pid, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ action: 'chat', message: text })
    });
    paintSpecTalk(talk, window._workStarted);
    window._draftSnap = '';
    await refreshDraft();
  } catch (e) {
    if (thread) thread.insertAdjacentHTML('beforeend', `<div class="qa reply"><div class="who">assistant</div><div class="body err">${esc(e.message||e)}</div></div>`);
  } finally {
    if (btn) btn.disabled = false;
  }
}

async function saveTask(task){
  const name = (document.getElementById('task-name')||{}).value || '';
  const raw = (document.getElementById('task-steps')||{}).value || '';
  const steps = raw.split('\n').map(s => s.trim()).filter(Boolean);
  try {
    await specTask('edit_task', task, { name, steps });
    await refreshDraft();
  } catch (e) { alert(e.message||e); }
}

function lastLog(j){
  const kept = activityLines((j.log||'').split('\n'));
  return kept[kept.length-1] || '';
}

function statusPhrase(j){
  const last = lastLog(j);
  if (j.status === 'waiting') {
    const open = (j.turns||[]).find(t => !(t.answer||'').trim());
    const q = (j.question || (open && open.question) || '').split(/[?\n]/)[0].trim();
    return q ? 'Waiting for your answer — '+q : 'Waiting for your answer';
  }
  if (j.status === 'running' || j.status === 'pending') {
    return last || ('Working with '+(j.model || j.backend || 'the model')+'…');
  }
  if (j.status === 'paused') return last ? 'Paused — '+last : 'Paused';
  if (j.status === 'interrupted') return 'Stopped. Resume to continue from the spec already written.';
  if (j.status === 'failed') return failCopy((j.error||'').trim() || last);
  if (j.status === 'done') return last || 'Finished';
  return j.status;
}

function paintActivity(j){
  const st = document.getElementById('job-status');
  if (st) st.textContent = statusPhrase(j);
  const pill = document.getElementById('job-status-pill');
  if (pill) pill.innerHTML = statusDot(j.status)+esc(j.status);
  const lines = activityLines((j.log||'').split('\n')).slice(-8);
  const act = document.getElementById('job-activity');
  if (act) {
    act.innerHTML = lines.length
      ? `<div class="cap">Activity</div><ol class="activity">${lines.map(l => {
          const sid = storyIdForWrite(l);
          return sid
            ? `<li><button type="button" onclick="selectEntity('${esc(sid)}')">${esc(l)}</button></li>`
            : `<li>${esc(l)}</li>`;
        }).join('')}</ol>`
      : '';
  }
  const log = document.getElementById('job-log');
  if (log) log.textContent = (j.log||'').trim() || '(no log yet)';
}

function paintFail(j){
  const el = document.getElementById('job-fail');
  if (!el) return;
  if (j.status === 'running' || j.status === 'pending') {
    const last = lastLog(j);
    el.innerHTML = `<div class="banner">
      <span class="dot accent"></span>
      <div class="q">${esc(last || ('Waiting on '+(j.model || j.backend)+'…'))}</div>
      <button type="button" class="ghost" id="btn-cancel">Cancel</button>
    </div>`;
    return;
  }
  if (j.status !== 'failed' && j.status !== 'interrupted') { el.innerHTML = ''; return; }
  const interrupted = j.status === 'interrupted';
  const issue = j.issue;
  const raw = (j.error || '').trim() || ((j.log||'').split('\n').filter(l => l.startsWith('failed:')).pop() || '').replace(/^failed:\s*/, '');
  const msg = (issue && issue.title) || (interrupted
    ? 'This run was stopped. Resume to continue from the spec already written.'
    : failCopy(raw));
  const steps = (issue && issue.steps && issue.steps.length)
    ? `<ol>${issue.steps.map(s => `<li>${esc(s)}</li>`).join('')}</ol>`
    : '';
  el.innerHTML = `<div class="ask-box">
    <div class="who">${interrupted ? 'Stopped' : "Couldn't finish"}</div>
    <div class="q">${esc(msg)}</div>
    ${steps}
    <div class="compose-bar"><button type="button" id="btn-resume">${interrupted ? 'Resume' : 'Retry'}</button></div>
  </div>`;
}

function failCopy(raw){
  const s = String(raw||'');
  if (/credit|spending limit|permission-denied/i.test(s))
    return 'xAI refused the request: this team is out of credits or hit its spending limit.';
  if (/timed out|didn't respond/i.test(s))
    return "The model didn't respond in time. If this was a local model, Ollama may be busy.";
  if (/no api key/i.test(s))
    return 'No API key. Open Keys in the sidebar, or put it in ~/.shalt/config.toml.';
  return s || "The run didn't finish.";
}

function paintTalk(j){
  const root = document.getElementById('talk');
  if (!root) return;
  const turns = (j.turns && j.turns.length) ? j.turns : (j.question ? [{question:j.question, answer:''}] : []);
  const done = turns.filter(t => (t.answer||'').trim());
  const open = j.status === 'waiting' ? (turns.find(t => !(t.answer||'').trim()) || {question: j.question||'', answer:''}) : null;
  window._openTurn = open || window._openTurn;
  let html = '';
  if (done.length) {
    html += `<div class="cap" style="margin-bottom:12px">What we know</div>`;
    for (const t of done) {
      html += `<div class="qa reply"><div class="body">${prose(t.answer)}</div>
        <p class="status-line" style="margin:8px 0 0">${esc((t.question||'').split(/[.?]/)[0]).slice(0,120)}</p></div>`;
    }
  }
  if (open && open.question) {
    html += `<p class="stat">A question is open. Answer it in the dialog.</p>`;
    if (!window._askId) openAsk(j.id);
  }
  root.innerHTML = html;
  if (open && window._discussOpen) paintSide(open);
}

function lastAssistant(turn){
  const chat = (turn && turn.chat) || [];
  for (let i = chat.length-1; i>=0; i--) {
    if (chat[i].role === 'assistant' && (chat[i].content||'').trim()) return chat[i].content;
  }
  return (turn && turn.guess) || '';
}

function parseAnswer(text){
  const m = String(text||'').match(/ANSWER:\s*([\s\S]+)/i);
  return (m ? m[1] : text).trim();
}

function chatHtml(turn){
  const chat = (turn && turn.chat) || [];
  let html = '';
  if (turn && turn.guess && !chat.length) {
    html += `<div class="qa reply"><div class="who">Guess</div><div class="body">${prose(turn.guess)}</div></div>`;
  }
  for (const m of chat) {
    const who = m.role==='user' ? 'You' : ([m.backend, m.model].filter(Boolean).join(' ') || 'Shalt');
    html += `<div class="qa ${m.role==='user'?'reply':''}"><div class="who">${esc(who)}</div><div class="body">${prose(m.content)}</div></div>`;
  }
  return html;
}

function paintSide(turn){
  const html = chatHtml(turn);
  for (const id of ['side-thread', 'ask-thread']) {
    const el = document.getElementById(id);
    if (!el) continue;
    const first = !el.dataset.html;
    const nearBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 48;
    const same = el.dataset.html === html;
    if (!same) {
      el.dataset.html = html;
      el.innerHTML = html;
    }
    if (first || (!same && nearBottom)) el.scrollTop = el.scrollHeight;
  }
}

function wireChat(jobId, turn){

  const side = document.getElementById('side');
  if (side) {
    side.hidden = false;

  }
  const box = document.getElementById('ask-chat');
  if (box) box.hidden = false;
  const disc = document.getElementById('btn-discuss');
  if (disc) disc.textContent = 'Hide chat';
  paintSide(turn);
  const close = document.getElementById('side-close');
  if (close) close.onclick = closeDiscuss;
  const send = document.getElementById('side-send');
  if (send) send.onclick = () => sendDiscuss(jobId);
  const use = document.getElementById('side-use');
  if (use) use.onclick = () => useDiscussAnswer();
  const inlineSend = document.getElementById('btn-chat-send');

  const inlineUse = document.getElementById('btn-use');
  if (inlineUse) inlineUse.onclick = () => useDiscussAnswer();
  const onKey = (ev) => {
    if ((ev.metaKey || ev.ctrlKey) && ev.key === 'Enter') {
      ev.preventDefault();
      sendDiscuss(jobId, ev.target && ev.target.id);
    }
  };
  const a = document.getElementById('ask-chat-in');
  const s = document.getElementById('side-in');
  if (a) a.onkeydown = onKey;

async function sendDiscuss(jobId, fromId){
  const inp = document.getElementById(fromId || 'side-in') || document.getElementById('ask-chat-in') || document.getElementById('side-in');
  const text = (inp && inp.value || '').trim();
  if (!text) return;
  if (inp) inp.value = '';
  const senders = [document.getElementById('side-send'), document.getElementById('btn-chat-send')];
  senders.forEach(b => { if (b) b.disabled = true; });
  try {
    const j = await jobAction(jobId, 'chat', undefined, undefined, text);
    const turn = (j.turns||[]).slice().reverse().find(t => !(t.answer||'').trim()) || {};
    window._openTurn = turn;
    paintSide(turn);
  } catch (e) {
    const thread = document.getElementById('ask-thread') || document.getElementById('side-thread');
    if (thread) thread.insertAdjacentHTML('beforeend', `<div class="qa"><div class="who">Error</div><div class="body">${esc(e.message||e)}</div></div>`);
  } finally {
    senders.forEach(b => { if (b) b.disabled = false; });
  }
}

function quietLiveLine(kind, line){
  let t = String(line || '').trim();

  t = t.replace(/…\s*\d+s\s*$/i, '…').replace(/\s+\d+s\s*$/i, '');
  const k = String(kind || '').toLowerCase();
  if (/^(turn \d+: )?running tests$/i.test(t) || /^running the test suite$/i.test(t)) {
    if (k === 'run' || k === 'build' || k === 'steps') return '';
  }
  if (isHeartbeat(t) || /^step \d+: waiting on the model/i.test(t) || /^contacting /i.test(t)) {
    return '';
  }
  return t;
}
function liveStatusText(kind, raw, think){
  const line = quietLiveLine(kind, raw);
  const wait = thinkElapsed(think);
  if (line && wait) return line + ' · ' + wait;
  if (line) return line;
  if (wait) return 'thinking ' + wait;
  return '';
}
function stageSub(kind, line){
  const t = String(line || '').toLowerCase();
  const k = String(kind || '').toLowerCase();
  if (k === 'build') {
    if (/running tests/.test(t)) return 'Proving';
    if (/writing code|wrote |\[write_file\]/.test(t)) return 'Implementing';
    if (/rejected/.test(t)) return 'Rejected';
    if (/visible green/.test(t)) return 'Measuring';
  }
  if (k === 'run' && /running/.test(t)) return 'Suite';
  if (k === 'steps' && /writing/.test(t)) return 'Scaffolding';
  if (k === 'author') return 'Spec';
  if (k === 'design') return 'Drawing';
  return '';
}

function liveElapsedSecs(now){
  if (!now) return 0;
  const stamp = now.created_at || now.started;
  if (!stamp) return Number(now.secs || now.spent_secs || 0) || 0;
  const t = Date.parse(stamp);
  if (!t) return Number(now.secs || 0) || 0;
  return Math.max(0, Math.round((Date.now() - t) / 1000));
}
function liveSpentSecs(p){

}

  const green = s.green||0, red = s.red||0, pending = s.pending||0, stale = s.stale||0;

    return;
  }
  const kind = now.kind || (a && a.kind) || p.phase || '';
  const who = whoLabel(now.backend || (a && a.backend), now.model || (a && a.model));
  const title = liveCardName(kind, now);
  const raw = now.line || (a && a.line) || '';
  const line = liveStatusText(kind, raw, now.think || (a && a.think) || '');
  const href = nowSpecHref(p, now) || (a ? `#/jobs/${esc(a.id)}` : '#');
  const jobHref = now.job_id ? `#/jobs/${esc(now.job_id)}` : (a ? `#/jobs/${esc(a.id)}` : '');
  const wait = isWaiting(p, now.job_id ? now : a);
  const fp = [kind, who, href, wait].join('\t');
  if (el.dataset.fp === fp && el.querySelector('[data-now-cap]')) {
    patchNowFields(el, kind, now, a, line);
    const log = el.querySelector('[data-now-log]');
    if (log && jobHref) log.setAttribute('href', jobHref);
    armElapsed(p);
    return;
  }
  el.dataset.fp = fp;
  el.hidden = false;
  el.className = 'live-bar';
  const sub = stageSub(kind, raw);
  const tokens = Number(now.tokens || (a && a.tokens) || 0) || 0;
  const turn = Number(now.turn || (a && a.turn) || 0) || 0;
  el.innerHTML = `
    ${statusDot((a && a.status) || now.status || p.state || 'running')}
    <div class="live-main">
      <div class="live-meta">
        <span class="cap" data-now-cap>Now · ${esc(kindLabel(kind))}${sub ? ' · '+esc(sub) : ''}${who ? ' · '+esc(who) : ''}</span>
        <span class="mono" data-now-elapsed>${esc(dur(liveElapsedSecs(now)))}</span>
        <span class="mono" data-now-tokens>${tokens ? esc(tok(tokens)) : '—'}</span>
        <span class="mono" data-now-turn>${turn ? 'turn '+turn : 'turn —'}</span>
      </div>
      <div class="focus-title"><a href="${href}"${ticketByRid(p, now.rid) ? ` data-ent="${esc(ticketByRid(p, now.rid).id)}"` : ''}>${esc(title)}</a></div>
      ${playStagesHtml(kind)}
      <span class="stat" data-now-line title="${esc(line)}">${esc(line) || '&nbsp;'}</span>
    </div>
    <div class="card-actions" style="margin:0">
      ${wait ? answerButton(p) : ''}
      ${jobHref && !wait ? `<a class="ghost" data-now-log href="${jobHref}">Log</a>` : ''}
    </div>`;
  armElapsed(p);
}

function paintAskLog(p){
  const el = document.getElementById('ask-log');
  if (!el) return;
  const asks = (p && p.asks) || [];
  if (!asks.length) {
    el.hidden = true;
    el.innerHTML = '';
    return;
  }
  el.hidden = false;
  const yolo = asks.some(a => a.yolo);
  const hint = yoloModeOf(p) === 'all'
    ? 'Yolo all is taking every guess. Correct any you disagree with — the next Play uses your answer.'
    : yoloModeOf(p) === 'plan'
      ? 'Yolo plan takes sprint-planning guesses only. Spec/tests/code still wait on you.'
      : (yolo
      ? 'Guesses taken while Yolo was on. Correct any you disagree with.'
      : 'Questions already answered. Correct any that should have gone the other way.');
  el.innerHTML = `<div class="cap">Asked questions</div>
    <p class="stat">${esc(hint)}</p>
    <ol>${asks.map((a, i) => {
      const ans = (a.answer || a.guess || '').trim();
      const who = a.yolo ? 'Yolo guessed' : 'Answered';
      return `<li>
        <p class="ask-q">${esc(a.question)}</p>
        <p class="ask-a ${a.yolo?'ask-guess':''}">${esc(who)}: ${esc(ans || '—')}</p>
        <div class="card-actions" style="margin:6px 0 0">
          <button type="button" class="ghost" data-correct="${i}">Correct</button>
        </div>
      </li>`;
    }).join('')}</ol>`;
  el.querySelectorAll('[data-correct]').forEach(btn => {
    btn.onclick = async () => {
      const a = asks[Number(btn.getAttribute('data-correct'))];
      if (!a || !p || !p.id) return;
      const next = await deskPrompt({
        title: 'Correct this',
        body: a.question,
        value: a.answer || a.guess || '',
        ok: 'Save'
      });
      if (next == null || !String(next).trim()) return;
      try {
        const out = await api('/api/project/'+encodeURIComponent(p.id), {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ action: 'correct_ask', question: a.question, content: String(next).trim() })
        });
        p.asks = (out && out.asks) || p.asks;
        paintAskLog(p);
      } catch (e) { deskAlert(e.message || e); }
    };
  });
}

function followFocus(p){

  const now = p.focus && p.focus.now;

async function changeStack(sel){
  const pid = sel.dataset.id;
  const stack = sel.value;
  const was = sel.dataset.was || '';
  if (!pid || !stack || stack === was) return;
  const row = (window._stacks || []).find(s => s.id === stack);
  const pretty = row ? row.label : stack;
  if (was) {
    const ok = await deskConfirm({
      title: 'Switch language',
      body: 'Switch this project to '+pretty+'?\n\nSpec and plan stay. Leftover files from the old language are removed. Does not Play.',
      ok: 'Switch',
      cancel: 'Keep'
    });
    if (!ok) { sel.value = was; return; }
  }
  try {
    const r = await api('/api/project/'+pid, {
      method:'POST',
      headers:{'content-type':'application/json'},
      body: JSON.stringify({ action:'stack', stack })
    });
    document.querySelectorAll('select.stack-sel[data-id="'+pid.replace(/"/g,'')+'"]').forEach(s => {
      s.value = stack;
      s.dataset.was = stack;
    });
    const msg = document.getElementById('stack-msg');
    if (msg) msg.textContent = r.note || 'Restacked.';
    const onProject = document.querySelector('.proj-name.title')?.dataset.id === pid;
    if (onProject) await renderProject(pid, Object.assign(parseHash(), { rebuild: true }));
    else if (parseHash().page === 'inbox') await renderOrg();
  } catch (e) {
    sel.value = was;
    alert(e.message || e);
  }
}

function tok(n){
  n = Number(n)||0;
  const sign = n < 0 ? '-' : '';
  n = Math.abs(n);
  if (n >= 1000000) return sign+(n/1000000).toFixed(n%1000000?1:0).replace(/\.0$/,'')+'M';
  if (n >= 1000) return sign+(n/1000).toFixed(n>=10000||n%1000===0?0:1).replace(/\.0$/,'')+'k';
  return sign+String(n);
}

function ticketForecast(p, rid){
  const rows = (p && p.queue) || [];
  const row = (rid && rows.find(r => r.rid === rid)) || {};
  return {
    tokens: Number(row.estimate || row.token_estimate || 0) || 0,
    secs: Number(row.forecast_secs || row.time_estimate_secs || 0) || 0
  };
}
function forecastBits(tokens, secs){
  const bits = [];
  if (tokens) bits.push(tok(tokens));
  if (secs) bits.push(dur(secs));
  return bits.join(' · ');
}

function workMapHtml(m){
  if (!m || (!(m.ready||[]).length && !(m.blocked||[]).length)) return '';
  const waves = m.waves || [];
  const byRid = {};
  for (const n of (m.ready||[]).concat(m.blocked||[])) byRid[n.rid] = n;
  const rows = waves.map((w,i) => {
    const bits = (w||[]).map(rid => {
      const n = byRid[rid] || { rid, name: rid, why: '' };
      return `<li><span class="mono">${esc(n.rid)}</span> ${esc(n.name || '')}${n.why && i ? ` <span class="stat">· ${esc(n.why)}</span>` : ''}</li>`;
    }).join('');
    return `<div class="stat" style="margin-top:8px"><div class="cap">${i===0 ? 'Start now' : 'Then'} · wave ${i+1} · ${(w||[]).length}</div><ul class="focus-queue">${bits}</ul></div>`;
  }).join('');
  return `<div class="cap" style="margin-top:14px">Work map</div>
    <p class="stat">${esc(m.note || '')}</p>${rows}`;
}

function dur(s){
  s = Math.max(0, Number(s)||0);
  if (s < 45) return Math.round(s)+'s';
  if (s < 90*60) {
    const m = s/60;
    return (m < 10 ? m.toFixed(1).replace(/\.0$/,'') : String(Math.round(m)))+'m';
  }
  return (s/3600).toFixed(1).replace(/\.0$/,'')+'h';
}

function measureLine(it){
  if (!it) return '';
  const ft = Number(it.estimate || it.token_estimate || 0);
  const fs = Number(it.forecast_secs || it.time_estimate_secs || 0);
  const st = Number(it.spent_tokens || 0);
  const ss = Number(it.spent_secs || 0);
  const f = [ft ? tok(ft)+' tok' : '', fs ? dur(fs) : ''].filter(Boolean).join(' / ') || 'pending';
  return 'forecast '+f+' · spent '+tok(st)+' tok / '+dur(ss);
}

  const a = roster().find(x => x.id === backend);

function inlineMd(s){
  return esc(s)
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\[(.+?)\]\((https?:[^)]+)\)/g, '<a href="$2" target="_blank" rel="noreferrer">$1</a>')
    .replace(/\[(.+?)\]\((#\/[^)]+)\)/g, '<a href="$2">$1</a>');
}
function inAnchor(before){
  return before.lastIndexOf('<a ') > before.lastIndexOf('</a>')
    || before.lastIndexOf('<') > before.lastIndexOf('>');
}
function journeyNavLabel(slug){
  return ({
    award: 'Buyer', desk: 'Desk', traveler: 'Traveler',
    compose: 'Compose', quote: 'Quote', lifecycle: 'Lifecycle',
    role: 'Role', shell: 'Shell'
  })[slug] || slug;
}
function filmHash(pid, journey, rid){
  const id = pid || window._specProject || '';
  let h = '#/p/'+id+'/film/'+encodeURIComponent(journey || '');
  if (rid) h += '/'+encodeURIComponent(rid);
  return h;
}
function journeyLinkTargets(p){
  const pid = (p && p.id) || window._specProject || '';
  const stories = ((p && p.draft && p.draft.stories) || []);
  const films = (p && p.films) || [];
  const out = [];
  const push = (name, href, open, ent) => {
    const n = String(name || '').trim();
    if (n.length < 3 || n.length > 40) return;
    if (/\s{2,}/.test(n)) return;
    out.push({ name: n, href, open: open || '', ent: ent || '' });
  };
  for (const film of films) {
    if (film.kind === 'none') continue;
    const first = ((film.frames) || []).find(fr => fr.rid);
    const href = filmHash(pid, film.journey, first && first.rid);
    const open = (first && first.rid) || '';
    push(film.journey, href, open, film.journey);
    const lab = journeyNavLabel(film.journey);
    if (lab && lab.toLowerCase() !== String(film.journey).toLowerCase()) {
      push(lab, href, open, film.journey);
    }
  }
  for (const st of stories) {
    const film = films.find(f => f.journey === st.epic || f.journey === st.id);
    if (!film || film.kind === 'none') continue;
    const first = ((film.frames) || []).find(fr => fr.rid);
    const href = filmHash(pid, film.journey, first && first.rid);
    const short = String(st.name || '').split(/[.—–-]/)[0].trim();
    push(short, href, first && first.rid, film.journey);
  }
  out.sort((a, b) => b.name.length - a.name.length);
  const seen = new Set();
  return out.filter(x => {
    const k = x.name.toLowerCase();
    if (seen.has(k)) return false;
    seen.add(k);
    return true;
  });
}
function linkPlanHtml(html, p){
  const pid = (p && p.id) || window._specProject || '';
  html = html.replace(/\b(S-[a-f0-9]{6,})\b/gi, (rid, _m, offset, full) => {
    const before = full.slice(0, offset);
    if (inAnchor(before)) return rid;
    const t = taskByRid(p, rid);
    const href = t && t.id ? entityHash(pid, t.id) : '#/p/'+pid+'/item/'+rid;
    return `<a href="${href}" data-ent="${esc((t && t.id) || rid)}">${rid}</a>`;
  });
  for (const st of journeyLinkTargets(p)) {
    const re = new RegExp('\\b'+st.name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')+'\\b', 'gi');
    html = html.replace(re, (m, offset, full) => {
      const before = full.slice(0, offset);
      if (inAnchor(before)) return m;
      const open = st.open ? ` data-open-film="${esc(st.open)}"` : '';
      const ent = st.ent ? ` data-journey="${esc(st.ent)}"` : '';
      return `<a href="${esc(st.href)}"${ent}${open}>${m}</a>`;
    });
  }
  return html;
}
function journalJourneyLinks(p){
  const pid = (p && p.id) || window._specProject || '';
  const films = ((p && p.films) || []).filter(f => f.kind !== 'none');
  if (!films.length) return '';

function bindFilmLinks(root, p){

  root.querySelectorAll('a[data-open-film], a[data-journey], a[href*="/film/"]').forEach(a => {

      const rid = a.getAttribute('data-open-film');
      let journey = a.getAttribute('data-journey') || '';
      const m = href.match(/\/film\/([^/]+)/);
      if (!journey && m) journey = decodeURIComponent(m[1]);
      const el = journey ? document.getElementById('film-'+journey) : null;
      if (el) el.scrollIntoView({ block: 'nearest' });
      const first = rid || (journey && firstRidForJourney(p, journey));

        window._filmReturn = '#/p/'+pid+'/plan';
        openFilmModal(p, first);

function bindJournalLinks(root, p){

function firstRidForJourney(p, journey){
  const film = ((p && p.films) || []).find(f => f.journey === journey);
  const first = film && ((film.frames) || []).find(fr => fr.rid);
  return (first && first.rid) || '';
}
function mdHtml(src, p){
  const raw = String(src||'').replace(/\r/g,'');
  const figs = p ? planFigures(p) : {};
  const token = {
    '{{kpis}}': figs.kpis || '',
    '{{journeys}}': figs.journeys || '',
    '{{map}}': figs.map || ''
  };
  if (!raw.trim()) {
    const intro = '<p class="lede">The plan is still a blank page. Write what this system is for, who it serves, and how the journeys hang together. Charts fill in as the spec lands.</p>';
    return '<div class="plan-spread"><div class="plan-copy plan-md">'+intro+'</div><aside class="plan-rail">'+(figs.kpis||'')+(figs.journeys||'')+'</aside></div>';
  }
  let used = { kpis:false, journeys:false, map:false };
  const blocks = raw.split(/\n{2,}/).map(block => {
    const trim = block.trim();
    if (token[trim]) {
      if (trim === '{{kpis}}') used.kpis = true;
      if (trim === '{{journeys}}') used.journeys = true;
      if (trim === '{{map}}') used.map = true;
      return token[trim];
    }
    const lines = block.split('\n');
    if (lines.every(l => /^\s*[-*] /.test(l))) {
      return '<ul>'+lines.map(l => '<li>'+inlineMd(l.replace(/^\s*[-*] /, ''))+'</li>').join('')+'</ul>';
    }
    if (lines.every(l => /^\s*\d+\. /.test(l))) {
      return '<ol>'+lines.map(l => '<li>'+inlineMd(l.replace(/^\s*\d+\. /, ''))+'</li>').join('')+'</ol>';
    }
    const first = lines[0] || '';
    const rest = lines.slice(1).map(inlineMd).join('<br/>');
    if (/^### /.test(first)) return '<h4>'+inlineMd(first.slice(4))+'</h4>'+(rest ? '<p>'+rest+'</p>' : '');
    if (/^## /.test(first)) return '<h3>'+inlineMd(first.slice(3))+'</h3>'+(rest ? '<p>'+rest+'</p>' : '');
    if (/^# /.test(first)) return '<h3>'+inlineMd(first.slice(2))+'</h3>'+(rest ? '<p>'+rest+'</p>' : '');
    return '<p>'+lines.map(inlineMd).join('<br/>')+'</p>';
  });
  const html = blocks.join('');
  const marked = html.replace(/<p>([\s\S]*?)<\/p>/, '<p class="lede">$1</p>');
  const rail = (!used.kpis ? (figs.kpis||'') : '') + (!used.journeys ? (figs.journeys||'') : '') + (used.map ? '' : '');
  return '<div class="plan-spread"><div class="plan-copy plan-md">'+linkPlanHtml(marked, p)+'</div><aside class="plan-rail">'+rail+'</aside></div>';
}

function statusMix(rows){
  const n = { green:0, red:0, pending:0, stale:0 };
  for (const r of rows || []) {
    if (n[r.status] != null) n[r.status]++;
    else n.pending++;
  }
  const bits = [];
  if (n.green) bits.push(n.green+' upheld');
  if (n.red) bits.push(n.red+' failing');
  if (n.pending) bits.push(n.pending+' no test');
  if (n.stale) bits.push(n.stale+' stale');
  return {
    n,
    label: bits.join(' · ') || 'empty',
    bar: remainingBar({ total: (rows||[]).length, green: n.green, red: n.red, pending: n.pending, stale: n.stale })
  };
}

    g: ((p.board||{}).goals||[]).map(g => g.id+g.title),

  });

  }
  window._workSnap = snap;
  const board = p.board || {};
  const goals = board.goals || [];
  const miles = board.milestones || [];
  const rows = p.queue || [];
  const sprints = (p.sprints||[]).filter(s => !s.closed_at);

  for (const k of Object.keys(byMs)) {
    if (!ordered.some(m => m.id === k)) ordered.push({ id: k, title: k });
  }
  const ridOpen = parseHash().rid;
  const epicGroups = list => {
    const ep = {};
    for (const r of list) {
      const k = r.epic || 'ungrouped';
      (ep[k] = ep[k] || []).push(r);
    }
    return Object.keys(ep).sort().map(name => ({ name, items: ep[name] }));

  const tree = ordered.filter(m => (byMs[m.id]||[]).length).map(m => {

  }).join('');
  const goalHtml = goals.length

function bindFitIframe(wrap, iframe, designW, designH){
  if (!wrap || !iframe) return;
  if (wrap._fitObs) { try { wrap._fitObs.disconnect(); } catch (e) {} wrap._fitObs = null; }
  wrap.style.position = wrap.style.position || 'relative';
  wrap.style.overflow = 'hidden';
  iframe.style.position = 'absolute';
  iframe.style.border = '0';
  iframe.style.transformOrigin = 'top left';
  const fit = () => {
    const w = wrap.clientWidth || 1;
    const h = wrap.clientHeight || 1;
    const s = Math.min(w / designW, h / designH);
    iframe.style.width = designW + 'px';
    iframe.style.height = designH + 'px';
    iframe.style.transform = 'scale(' + s + ')';
    iframe.style.left = Math.max(0, (w - designW * s) / 2) + 'px';
    iframe.style.top = Math.max(0, (h - designH * s) / 2) + 'px';
  };
  if (window.ResizeObserver) {
    wrap._fitObs = new ResizeObserver(fit);
    wrap._fitObs.observe(wrap);
  }
  iframe.addEventListener('load', fit);
  fit();
}

function setMarkupMode(mode){
  const modal = document.getElementById('film-modal');
  if (!modal) return;
  window._markupMode = mode;
  modal.querySelectorAll('.markup-tools [data-mark]').forEach(b => {
    b.classList.toggle('on', b.getAttribute('data-mark') === mode);
  });
  const layer = modal.querySelector('.markup-layer');
  if (layer) layer.classList.toggle('armed', mode === 'pen' || mode === 'note' || mode === 'erase');
}
function paintMarkupCanvas(layer, data){
  const canvas = layer && layer.querySelector('canvas');
  if (!canvas) return;
  const w = layer.clientWidth || 1;
  const h = layer.clientHeight || 1;
  if (canvas.width !== w) canvas.width = w;
  if (canvas.height !== h) canvas.height = h;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, w, h);
  (data.strokes || []).forEach(s => {
    const pts = s.points || [];
    if (pts.length < 2) return;
    ctx.strokeStyle = s.color || '#c0392b';
    ctx.lineWidth = s.width || 2.4;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    pts.forEach((pt, i) => {
      const x = pt[0] * w, y = pt[1] * h;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.stroke();
  });
  const pins = layer.querySelector('.markup-pins');
  if (!pins) return;
  pins.innerHTML = (data.notes || []).map((n, i) =>
    `<button type="button" class="markup-pin" data-note="${i}" style="left:${(n.x||0)*100}%;top:${(n.y||0)*100}%" title="${esc(n.text||'Comment')}">${i+1}</button>`
  ).join('');
}
function markupPoint(layer, ev){
  const r = layer.getBoundingClientRect();
  return [
    Math.min(1, Math.max(0, (ev.clientX - r.left) / Math.max(1, r.width))),
    Math.min(1, Math.max(0, (ev.clientY - r.top) / Math.max(1, r.height)))
  ];
}
async function persistMarkup(p, rid, journey, file, data){
  if (!p || !p.id || !rid) return;
  try {
    await api('/api/project/' + encodeURIComponent(p.id), {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({
        action: 'save_markup',
        rid,
        markup: { rid, journey, file: file || '', strokes: data.strokes || [], notes: data.notes || [] }
      })
    });
  } catch (e) {}
}
function bindMarkup(p, rid, journey, file, layer){
  if (!layer) return;
  const data = window._markupData || { strokes: [], notes: [] };
  window._markupData = data;
  paintMarkupCanvas(layer, data);
  const canvas = layer.querySelector('canvas');
  let drawing = false;
  const flush = () => persistMarkup(p, rid, journey, file, data);
  canvas.onpointerdown = ev => {
    const mode = window._markupMode || 'off';
    if (mode === 'off') return;
    ev.preventDefault();
    const pt = markupPoint(layer, ev);
    if (mode === 'erase') {
      data.strokes = data.strokes.filter(s => {
        const pts = s.points || [];
        return !pts.some(q => Math.hypot(q[0]-pt[0], q[1]-pt[1]) < 0.03);
      });
      data.notes = data.notes.filter(n => Math.hypot((n.x||0)-pt[0], (n.y||0)-pt[1]) > 0.04);
      paintMarkupCanvas(layer, data);
      flush();
      return;
    }
    if (mode === 'note') {
      openNotePop(layer, pt, p, rid, journey, file, data);
      return;
    }
    if (mode !== 'pen') return;
    drawing = true;
    try { canvas.setPointerCapture(ev.pointerId); } catch (e) {}
    data.strokes.push({ color: '#c0392b', width: 2.4, points: [pt] });
  };
  canvas.onpointermove = ev => {
    if (!drawing) return;
    const stroke = data.strokes[data.strokes.length - 1];
    if (!stroke) return;
    stroke.points.push(markupPoint(layer, ev));
    paintMarkupCanvas(layer, data);
  };
  canvas.onpointerup = canvas.onpointercancel = () => {
    if (!drawing) return;
    drawing = false;
    flush();
  };
  layer.querySelector('.markup-pins').onclick = ev => {
    const btn = ev.target.closest('[data-note]');
    if (!btn) return;
    const n = data.notes[Number(btn.getAttribute('data-note'))];
    if (n) openNotePop(layer, [n.x, n.y], p, rid, journey, file, data, n);
  };
  if (layer._ro) try { layer._ro.disconnect(); } catch (e) {}
  layer._ro = new ResizeObserver(() => paintMarkupCanvas(layer, data));
  layer._ro.observe(layer);
}
function openNotePop(layer, pt, p, rid, journey, file, data, existing){
  layer.querySelectorAll('.note-pop').forEach(n => n.remove());
  const pop = document.createElement('div');
  pop.className = 'note-pop';
  pop.style.left = (pt[0] * 100) + '%';
  pop.style.top = (pt[1] * 100) + '%';
  pop.innerHTML = `<textarea placeholder="What should change here?">${esc((existing && existing.text) || '')}</textarea>
    <div class="card-actions">
      <button type="button" data-keep>Save</button>
      ${existing ? '<button type="button" class="ghost" data-drop>Remove</button>' : ''}
      <button type="button" class="ghost" data-cancel>Cancel</button>
    </div>`;
  layer.appendChild(pop);
  const ta = pop.querySelector('textarea');
  ta.focus();
  pop.querySelector('[data-keep]').onclick = () => {
    const text = ta.value.trim();
    if (existing) existing.text = text;
    else if (text) data.notes.push({ id: 'n-'+Date.now().toString(16), x: pt[0], y: pt[1], text });
    pop.remove();
    paintMarkupCanvas(layer, data);
    persistMarkup(p, rid, journey, file, data);
  };
  const drop = pop.querySelector('[data-drop]');
  if (drop) drop.onclick = () => {
    data.notes = data.notes.filter(n => n !== existing);
    pop.remove();
    paintMarkupCanvas(layer, data);
    persistMarkup(p, rid, journey, file, data);
  };
  pop.querySelector('[data-cancel]').onclick = () => pop.remove();
}
async function loadMarkupInto(p, rid, layer){
  window._markupData = { strokes: [], notes: [] };
  if (!p || !p.id || !rid) return;
  try {
    const m = await api('/api/project/' + encodeURIComponent(p.id) + '/markups/' + encodeURIComponent(rid));
    window._markupData = { strokes: m.strokes || [], notes: m.notes || [] };
  } catch (e) {}
  if (layer) paintMarkupCanvas(layer, window._markupData);
}

function redrawProject(id){

  if (!p || p.id !== id) return;

function designPrompt(mode, rid, name, journey){
  if (mode === 'redraw-all') {
    return 'Redraw every UI frame. Full product chrome at the kit platform. Detail beats stay in that chrome (data-rid). Every control clickable; unproven paths are a red stub. kind=none journeys stay without screens. spec_hash must match each journey.';
  }
  if (mode === 'redraw-one') {
    return `Redraw this beat in the full product chrome (${rid} — ${name} in journey ${journey}). Not an orphan page. Leave other frames. Do not write spec/, tests, contract/, or src/.`;
  }
  if (mode === 'polish') {
    return 'Finalize the design template from the interview. This is one look for every mockup, not a single beat. Write mockups/tokens.final.css: color, type, density, shadows; same structure as the sketches; no pencil borders. If the interview asks for a layout change, apply it on every journey\'s HTML. Do not invent screens. Do not polish individual screens this turn — the template comes first. Do not write spec/, tests, contract/, src/, or .shalt/.';
  }
  if (mode === 'polish-one') {
    return `The overall look is already set in mockups/tokens.final.css. Honor it. Do not rewrite that file. Polish only this screen: journey ${journey}, rid ${rid} — ${name}. Edit that journey's HTML. Honor pins on this frame. Leave other journeys. Do not write spec/, tests, contract/, src/, or .shalt/.`;
  }
  if (mode === 'all') {
    return 'Draw every empty UI frame that still has no HTML. Full chrome at the kit platform; details are regions, not separate pages. Keep files that already exist. spec_hash must match each journey.';
  }
  return `Draw only this beat in the full product chrome. Journey ${journey}. Frame ${rid} — ${name}. Write storyboard.json and the HTML for this frame. Leave other empty frames empty. Do not write spec/, tests, contract/, or src/.`;
}
function designLabel(mode){
  return ({
    all: 'Draw every empty screen',
    one: 'Draw this screen',
    'redraw-all': 'Regenerate all',
    'redraw-one': 'Regenerate',
    polish: 'Apply polish',
    'polish-one': 'Polish this screen'
  })[mode] || 'Draw';
}
async function requestDesign(p, rid, mode, btn){
  if (!p || !p.id) return;
  mode = mode === true ? 'all' : (mode === false || !mode ? (rid ? 'one' : 'all') : mode);
  if (mode === 'polish-one' && !p.product_look) return;
  const all = mode === 'all' || mode === 'redraw-all' || mode === 'polish';
  const hit = frameForRid(p, rid);
  const name = (hit && hit.frame && (hit.frame.caption || hit.frame.name)) || rid;
  const journey = (hit && hit.film && hit.film.journey) || '';
  const prompt = designPrompt(mode, rid, name, journey);
  const row = ((p.queue)||[]).find(r => r.rid === rid) || {};
  const modal = document.getElementById('film-modal');
  const wall = document.getElementById('plan-films');
  const disable = el => { if (el) el.querySelectorAll('[data-draw], [data-iv="polish"]').forEach(b => { b.disabled = true; }); };
  const enable = el => { if (el) el.querySelectorAll('[data-draw], [data-iv="polish"]').forEach(b => { b.disabled = false; }); };
  disable(modal); disable(wall);
  const redrawBtn = document.getElementById('proj-redraw');
  if (redrawBtn) redrawBtn.disabled = true;
  if (btn) btn.textContent = 'Drawing…';
  try {
    await api('/api/jobs', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({
        kind: 'design',
        project: p.id,
        prompt,
        rid: all ? '' : (rid || ''),
        backend: row.backend || '',
        model: row.model || ''
      })
    });
  } catch (e) {
    enable(modal); enable(wall);
    if (redrawBtn) redrawBtn.disabled = false;
    if (btn) btn.textContent = designLabel(mode);
    alert(e.message || e);
  }
}

function issueDateline(date, volume, number){
  const d = new Date(String(date||'')+'T12:00:00Z');
  const nice = isNaN(d.getTime())
    ? String(date||'')
    : d.toLocaleDateString('en-GB', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
  const vol = volume || 1;
  return 'Vol. '+vol+', No. '+number+' · '+nice;
}
function journalCommentTree(comments, parent){
  const kids = (comments || []).filter(c => (c.parent || '') === (parent || ''));
  if (!kids.length) return '';
  return kids.map(c => {
    const when = (c.at || '').replace('T',' ').replace('Z','');
    const nested = journalCommentTree(comments, c.id);
    return `<li class="journal-comment" data-comment="${esc(c.id)}">
      <p class="byline">${esc(c.by || 'You')}${when ? ' · '+esc(when) : ''}</p>
      <p>${esc(c.body || '')}</p>
      <button type="button" class="ghost" data-reply="${esc(c.id)}">Reply</button>
      ${nested ? `<ol class="journal-thread">${nested}</ol>` : ''}
    </li>`;
  }).join('');
}

      <p class="kicker">A project blog</p>
      <h2>${esc(name)}</h2>
      <p class="dateline">Vol. ${vol} · progress as work moves · a longer feature when something notable lands</p>
    </div>
    <p class="empty">${pending ? 'A feature is queued — the next agent will write it.' : 'No posts yet. Play writes progress notes; a longer feature when the spec first lands, screens appear, or a journey goes green.'}</p>`;
    return;
  }
  const latest = issues[0];
  const rest = issues.slice(1);
  const feats = (latest.dispatches || []).filter(d => d.form === 'feature');
  const prog = (latest.dispatches || []).filter(d => d.form !== 'feature');
  const head = `<div class="journal-mast">
    <p class="kicker">A project blog</p>
    <h2>${esc(name)}</h2>
    <p class="dateline">${esc(issueDateline(latest.date, vol, latest.number))}</p>
  </div>`;
  const main = feats.map(article).join('') || '<p class="empty">No feature yet — one lands when something notable happens.</p>';
  const side = prog.length
    ? '<div class="stream-label">Progress</div>' + prog.map(article).join('')
    : '<p class="empty">No progress posts this issue.</p>';
  const older = rest.map(issue => {
    const bits = (issue.dispatches || []).map(article).join('');
    return `<p class="dateline" style="margin:1.2em 0 0.6em">${esc(issueDateline(issue.date, vol, issue.number))}</p>` + bits;
  }).join('');
  host.innerHTML = head
    + `<div class="journal-spread"><div class="journal-main">${main}</div><aside class="journal-side">${side}</aside></div>`
    + (pending ? '<p class="stat">A longer feature is queued for the next agent.</p>' : '')
    + (older ? `<details class="fold"><summary>Earlier posts</summary>${older}</details>` : '');
  bindJournalLinks(host, p);
  bindJournalComments(host, p);
}
