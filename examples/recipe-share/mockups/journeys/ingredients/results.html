<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Packet Details - Shalt</title>
  <style>
     :root {
       --paper: #ffffff;
       --ink: #000000;
       --accent: #52796f;
       --text: #1a1a1a;
       --bg: #fbfdfe;
     }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 2rem;
      background-color: var(--paper);
      color: var(--ink);
      line-height: 1.5;
     }
    .packet-card {
      max-width: 480px;
      margin: 0 auto;
     }
    h1 {
      font-size: 1.75rem;
      margin-bottom: 0.25rem;
     }
     .packet-info {
      padding: 1rem;
      border-radius: 8px;
      background-color: var(--bg);
      margin: 1rem 0;
     }
    button.btn-primary {
      background-color: var(--accent);
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      border-radius: 6px;
      cursor: pointer;
     }
     button.btn-primary:hover {
      opacity: 0.9;
     }
    button.btn-secondary {
      background-color: var(--text);
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      border-radius: 6px;
      cursor: pointer;
    }
    button.btn-secondary:hover {
      background-color: #333;
     }
    button.btn-link {
      color: var(--accent);
      text-decoration: none;
     }
    button.btn-link:hover {
      text-decoration: underline;
     }
    @media (max-width: 768px) {
      body {
        padding: 1rem;
       }
      h1 {
        font-size: 1.5rem;
       }
     }
   </style>
</head>
<body>
   <div class="packet-card">
     <h1>Packet Details</h1>
     <p class="subtitle">Your packet is linked to recipe: "Weeknight Tomato Pasta"</p>
    
     <div class="packet-info">
       <strong>Recipe Name:</strong> Weeknight Tomato Pasta<br>
       <strong>Ingredients:</strong> Tomatoes (4)<br>
       <strong>Order:</strong> <span id="order-id" style="font-weight: bold;"></span>
     </div>
    
     <button class="btn-primary" onclick="window.location.href='/ingredients/'">Create Another Packet</button>
     <button class="btn-secondary" onclick="window.location.href='/recipes/'">View Recipes</button>
     <button class="btn-link" onclick="window.location.href='/sharing/'">Share This Recipe</button>
   </div>
</body>
</html>
